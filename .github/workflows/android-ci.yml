name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Verify repository, wrapper and secrets
        run: |
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          chmod +x gradlew
          ./gradlew --version

      - name: Unit test and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify APK integrity and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Run strict Android lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Print and enforce lint result
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          REPORT=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [[ -f "$REPORT" ]]; then
            cat "$REPORT"
          else
            echo "Lint failed but text report was not found." >&2
          fi
          exit 1

      - name: Prepare downloadable release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-v1.2.0-debug.apk
          (cd out && sha256sum GeminiLiveTranslate-v1.2.0-debug.apk > GeminiLiveTranslate-v1.2.0-debug.apk.sha256)

      - name: Publish rolling debug GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-latest"
          TITLE="Gemini Live Translate v1.2.0 Debug (latest)"
          NOTES="Automated verified debug build from commit ${GITHUB_SHA}. Unit tests, APK integrity, APK signature and Android Lint passed."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

          echo "APK published at: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
