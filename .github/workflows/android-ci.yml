name: Android CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: requested-conversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and commit requested conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Build without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --branch agent/audio-stream-public-files --single-branch "$REPO_URL" source
          cd source

          python3 tools/apply_requested_patch.py

          JAVA17="$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -mindepth 1 -maxdepth 1 -type d -name '17*' | sort -V | tail -n 1)"
          if [[ -n "$JAVA17" ]]; then
            export JAVA_HOME="$JAVA17/x64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version

          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt

          rm -f tools/apply_requested_patch.py badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add audio stream routing and public file access"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push origin HEAD:agent/audio-stream-public-files
