name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed updateable APK 1.2.2
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Build, verify, publish and deliver APK
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERT_SHA256: 85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95
        shell: bash
        run: |
          set -euo pipefail

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --branch main --single-branch "$REPO_URL" source
          cd source

          JAVA17="$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -mindepth 1 -maxdepth 1 -type d -name '17*' | sort -V | tail -n 1)"
          if [[ -n "$JAVA17" ]]; then
            export JAVA_HOME="$JAVA17/x64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version

          test -s .github/signing/stable-debug.keystore.b64
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          chmod +x gradlew
          ./gradlew --version
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"

          mkdir -p out
          cp "$APK" out/GeminiLiveTranslate-debug-latest.apk
          (cd out && sha256sum GeminiLiveTranslate-debug-latest.apk > GeminiLiveTranslate-debug-latest.apk.sha256)
          printf '%s\n' \
            'versionName=1.2.2-debug' \
            'versionCode=10202' \
            'applicationId=com.oai.geminilivetranslate.debug' \
            'signingMode=stable-debug' \
            "certificateSha256=$EXPECTED_CERT_SHA256" \
            "sourceCommit=$GITHUB_SHA" > out/VERSION.txt

          TAG="debug-latest"
          TITLE="Gemini Live Translate 1.2.2 Debug (latest)"
          NOTES="Verified updateable debug build from commit ${GITHUB_SHA}. Uses the repository's stable debug certificate so future APKs can update in place. Unit tests, APK integrity, certificate verification and Android Lint passed. One uninstall is required only when migrating from an APK signed with an older conflicting certificate."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [[ -z "$asset" ]] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

          mkdir -p /tmp/apk-delivery
          cp out/* /tmp/apk-delivery/
          rm -f apksigner.txt badging.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-delivery-build
          git rm -rf . || true
          git clean -fdx
          mkdir -p delivery
          cp /tmp/apk-delivery/* delivery/
          printf '%s\n' \
            'This branch contains the latest verified APK generated by Android CI.' \
            "Source commit: $GITHUB_SHA" \
            "Certificate SHA-256: $EXPECTED_CERT_SHA256" > delivery/README.txt
          git add -f delivery
          git commit -m "Deliver Gemini Live Translate 1.2.2 APK"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force origin HEAD:apk-delivery

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-1.2.2-debug
          path: source/delivery/GeminiLiveTranslate-debug-latest.apk
          if-no-files-found: error
          retention-days: 7
