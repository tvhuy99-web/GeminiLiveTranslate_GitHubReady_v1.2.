name: Android Pull Request Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build PR APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check PR source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_CERT_SHA256: 85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --no-checkout "$REPO_URL" source
          cd source
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"

          # R18.6 was prepared as a one-shot patch workflow. The previous PR build
          # never executed that patch, so extract and execute its embedded Python
          # before validation. Once the source is committed this becomes a no-op.
          if ! grep -q 'liveFileTranscribe=true' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt; then
            python3 - <<'R186EXTRACT'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/r186-ai-studio-all-modes.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.find(start_marker)
          if start < 0:
              raise SystemExit('R18.6 patch start marker not found')
          start += len(start_marker)
          end = workflow.find(end_marker, start)
          if end < 0:
              raise SystemExit('R18.6 patch end marker not found')
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/r186_apply.py').write_text(script)
          print(f'Extracted R18.6 patch: {len(script)} chars')
          R186EXTRACT
            python3 /tmp/r186_apply.py
          fi

          grep -q '!aiStudioMode && apiKey.isNullOrBlank()' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'liveFileTranscribe=true' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          test -s app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt

          JAVA17="$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -mindepth 1 -maxdepth 1 -type d -name '17*' | sort -V | tail -n 1)"
          if [[ -n "$JAVA17" ]]; then
            export JAVA_HOME="$JAVA17/x64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          java -version
          node --version

          test -s .github/signing/stable-debug.keystore.b64
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          python3 tools/check_embedded_js_syntax.py
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          ACTUAL_APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL_APK_SHA" != "a3b78e9c3370b5986e7d93a5728b933b722e0f2bb8964d45c574101d780a6d71"
          echo "R18.6 APK SHA-256: $ACTUAL_APK_SHA"

      - name: Upload PR debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.6-real-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
