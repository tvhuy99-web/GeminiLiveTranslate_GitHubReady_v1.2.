name: Android Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Verify repository and secrets in source
        run: |
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          path = Path("release-keystore.jks")
          path.write_bytes(data)
          print(f"Keystore restored: {path.stat().st_size} bytes")
          PY

      - name: Test and build signed release
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release-keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest lintRelease assembleRelease bundleRelease

      - name: Verify release signature and package files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release files
        run: |
          VERSION="${GITHUB_REF_NAME:-v1.2.0}"
          [[ "$VERSION" == refs/* || "$VERSION" == main ]] && VERSION="v1.2.0-manual-${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/GeminiLiveTranslate-${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/GeminiLiveTranslate-${VERSION}.aab"
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: GeminiLiveTranslate-signed-${{ github.ref_name }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --verify-tag \
            --generate-notes \
            --title "Gemini Live Translate $GITHUB_REF_NAME"

      - name: Remove keystore from runner
        if: always()
        run: rm -f release-keystore.jks
