name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          echo "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26  /tmp/gradle.zip" | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Verify project structure
        run: python3 tools/verify_project.py

      - name: Run tests and build APK
        run: /tmp/gradle-8.10.2/bin/gradle --no-daemon --stacktrace clean test assembleDebug

      - name: Rename APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/GeminiLiveTranslate-v1.2.0-debug.apk
          sha256sum artifacts/GeminiLiveTranslate-v1.2.0-debug.apk > artifacts/GeminiLiveTranslate-v1.2.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
