name: Verified APK Delivery

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write

jobs:
  deliver:
    if: github.event.pull_request.head.ref == 'apk-build-trigger-2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Build and deliver verified debug APK from main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=bootstrap
          RESULT=failure
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          publish_status() {
            code=$?
            trap - EXIT
            set +e
            status_dir="$(mktemp -d)"
            cd "$status_dir"
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            printf '%s\n' \
              "result=$RESULT" \
              "stage=$STAGE" \
              'signingMode=android-debug' \
              "sourceCommit=${GITHUB_SHA}" \
              "updatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > STATUS.txt
            git add STATUS.txt
            git commit -qm "APK delivery status: $RESULT at $STAGE"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
              push --force "$REPO_URL" HEAD:apk-delivery-status >/dev/null 2>&1
            exit "$code"
          }
          trap publish_status EXIT

          STAGE=clone-main
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            clone --branch main --single-branch "$REPO_URL" source
          cd source

          STAGE=toolchain
          JAVA17="$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk -mindepth 1 -maxdepth 1 -type d -name '17*' | sort -V | tail -n 1)"
          [[ -z "$JAVA17" ]] || export JAVA_HOME="$JAVA17/x64"
          [[ -z "${JAVA_HOME:-}" ]] || export PATH="$JAVA_HOME/bin:$PATH"
          java -version

          STAGE=source-verification
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          chmod +x gradlew

          STAGE=gradle-build
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

          STAGE=apk-verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' apksigner.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          STAGE=prepare-delivery
          mkdir -p /tmp/apk-delivery
          cp "$APK" /tmp/apk-delivery/GeminiLiveTranslate-1.2.2-debug.apk
          (cd /tmp/apk-delivery && sha256sum GeminiLiveTranslate-1.2.2-debug.apk > GeminiLiveTranslate-1.2.2-debug.apk.sha256)
          printf '%s\n' \
            'versionName=1.2.2-debug' \
            'versionCode=10202' \
            'applicationId=com.oai.geminilivetranslate.debug' \
            'signingMode=android-debug' \
            "certificateSha256=$CERT_SHA256" > /tmp/apk-delivery/VERSION.txt

          STAGE=push-delivery
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-delivery-build
          git rm -rf . || true
          git clean -fdx
          mkdir -p delivery
          cp /tmp/apk-delivery/* delivery/
          printf '%s\n' \
            'Verified debug APK generated from trusted main.' \
            "Source commit: $SOURCE_COMMIT" \
            'Signing mode: android-debug' > delivery/README.txt
          git add -f delivery
          git commit -m "Deliver Gemini Live Translate 1.2.2 debug APK"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force origin HEAD:apk-delivery

          STAGE=complete
          RESULT=success
