name: Apply basic settings accessibility fix

on:
  push:
    branches: [agent/basic-settings-accessibility]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/basic-settings-accessibility
          token: ${{ github.token }}
      - name: Patch SettingsActivity accessibility
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt')
          text = path.read_text()

          old = '''        tabButtons = TAB_LABELS.mapValues { (key, label) ->
            Button(this).apply {
                text = label
                isAllCaps = false
                minHeight = dp(48)
                setOnClickListener {
                    captureTextFields()
                    showTab(key, announce = true)
                }
                bar.addView(this)
            }
        }
'''
          new = '''        tabButtons = TAB_LABELS.mapValues { (key, label) ->
            Button(this).apply {
                text = label
                isAllCaps = false
                minHeight = dp(48)
                importantForAccessibility = View.IMPORTANT_FOR_ACCESSIBILITY_YES
                setOnClickListener {
                    captureTextFields()
                    showTab(key, announce = true)
                }
                bar.addView(this)
            }
        }
'''
          if old not in text:
              raise SystemExit('tab button block not found')
          text = text.replace(old, new, 1)

          old = '''            button.contentDescription = if (selected) {
                "${TAB_LABELS.getValue(tab)}, đang chọn"
            } else {
                TAB_LABELS.getValue(tab)
            }
'''
          new = '''            button.contentDescription = TAB_LABELS.getValue(tab)
            ViewCompat.setStateDescription(
                button,
                if (selected) "Đang chọn" else "Chưa chọn",
            )
'''
          if old not in text:
              raise SystemExit('tab state block not found')
          text = text.replace(old, new, 1)

          old = '''        spinner(
            labels = profileLabels,
            selected = profiles.indexOf(draft.performanceProfile).coerceAtLeast(0),
            accessibilityLabel = "Cách ứng dụng ưu tiên",
        ) { position ->
            captureTextFields()
            draft = SettingsPolicy.applyProfile(profiles[position], draft)
            toast("Đã chọn ${profileLabels[position]}")
            showTab(activeTab, announce = false)
        }
'''
          new = '''        spinner(
            labels = profileLabels,
            selected = profiles.indexOf(draft.performanceProfile).coerceAtLeast(0),
            accessibilityLabel = "Cách ứng dụng ưu tiên",
        ) { position ->
            captureTextFields()
            draft = SettingsPolicy.applyProfile(profiles[position], draft)
            toast("Đã chọn ${profileLabels[position]}")
        }
'''
          if old not in text:
              raise SystemExit('profile spinner block not found')
          text = text.replace(old, new, 1)

          old = '''        title("Bộ máy dịch")
        modelInput = EditText(this).apply {
            setText(draft.model)
            hint = "Giữ nguyên nếu không được hướng dẫn thay đổi"
            isSingleLine = true
            minHeight = dp(48)
            textSize = 16f
        }.also(content::addView)
'''
          new = '''        title("Bộ máy dịch")
        modelInput = labeledEditText(
            label = "Tên bộ máy dịch",
            value = draft.model,
            hint = "Giữ nguyên nếu không được hướng dẫn thay đổi",
        )
'''
          if old not in text:
              raise SystemExit('model input block not found')
          text = text.replace(old, new, 1)

          old = '''        languageInput = EditText(this).apply {
            setText(draft.targetLanguage)
            hint = "Ví dụ: vi, en-US"
            isSingleLine = true
            minHeight = dp(48)
            textSize = 16f
        }.also(content::addView)
'''
          new = '''        languageInput = labeledEditText(
            label = "Mã ngôn ngữ nhập thủ công",
            value = draft.targetLanguage,
            hint = "Ví dụ: vi, en-US",
        )
'''
          if old not in text:
              raise SystemExit('language input block not found')
          text = text.replace(old, new, 1)

          marker = '''    private fun check(
        label: String,
'''
          helper = '''    private fun labeledEditText(
        label: String,
        value: String,
        hint: String,
    ): EditText {
        val input = EditText(this).apply {
            id = View.generateViewId()
            setText(value)
            this.hint = hint
            isSingleLine = true
            minHeight = dp(48)
            textSize = 16f
            importantForAccessibility = View.IMPORTANT_FOR_ACCESSIBILITY_YES
        }
        content.addView(TextView(this).apply {
            text = label
            textSize = 14f
            labelFor = input.id
            setTextColor(themeColor(android.R.attr.textColorSecondary))
            setPadding(0, dp(4), 0, 0)
        })
        content.addView(input)
        return input
    }

'''
          if marker not in text:
              raise SystemExit('helper insertion point not found')
          text = text.replace(marker, helper + marker, 1)

          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'Fix accessibility of basic settings'
          git push origin HEAD:agent/basic-settings-accessibility
