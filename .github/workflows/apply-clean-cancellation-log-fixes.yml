name: Apply cancellation log fixes

on:
  push:
    branches: [agent/clean-cancellation-logs]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Patch source and commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" clone --branch agent/clean-cancellation-logs --single-branch "$REPO_URL" source
          cd source
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) A client cancellation requested by the app is not a connection failure.
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/network/GeminiLiveClient.kt",
              '''            override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {\n                setupComplete.set(false)\n                logger.log(0, "GeminiWS", "Kết nối thất bại HTTP=${response?.code}", t)\n                if (!explicitlyClosed.get()) deliverError(normalizeError(t, response))\n            }''',
              '''            override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {\n                setupComplete.set(false)\n                if (explicitlyClosed.get()) {\n                    logger.log(3, "GeminiWS", "WebSocket đã dừng theo yêu cầu")\n                    return\n                }\n                logger.log(0, "GeminiWS", "Kết nối thất bại HTTP=${response?.code}", t)\n                deliverError(normalizeError(t, response))\n            }''',
          )

          # 2) Coroutine cancellation while stopping a file is expected, not an audio-source error.
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/audio/FileAudioSource.kt",
              '''import kotlinx.coroutines.delay\n''',
              '''import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.delay\n''',
          )
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/audio/FileAudioSource.kt",
              '''        } catch (error: Throwable) {\n            if (!stopped.get()) {\n                logger?.log(0, "FileAudio", "Giải mã tệp thất bại", error)\n                listener.onError(error)\n            }\n        } finally {''',
              '''        } catch (error: Throwable) {\n            if (error is CancellationException) {\n                logger?.log(3, "FileAudio", "Dừng coroutine giải mã theo yêu cầu")\n            } else if (!stopped.get()) {\n                logger?.log(0, "FileAudio", "Giải mã tệp thất bại", error)\n                listener.onError(error)\n            }\n        } finally {''',
          )
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/audio/FileAudioSource.kt",
              '''    override fun seekBy(deltaMs: Long) { pendingSeekMs.set(currentPositionMs.get() + deltaMs) }''',
              '''    override fun seekBy(deltaMs: Long) {\n        val pending = pendingSeekMs.get()\n        val base = if (pending == NO_SEEK) currentPositionMs.get() else pending\n        pendingSeekMs.set(base + deltaMs)\n    }''',
          )

          # 3) AudioTrack worker cancellation during stop is expected.
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/audio/StreamingPcmPlayer.kt",
              '''import kotlinx.coroutines.CoroutineScope\n''',
              '''import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.CoroutineScope\n''',
          )
          replace_once(
              "app/src/main/java/com/oai/geminilivetranslate/audio/StreamingPcmPlayer.kt",
              '''            }.onFailure { error ->\n                if (worker?.isCancelled != true) logger?.log(0, diagnosticName, "Worker phát PCM dừng do lỗi", error)\n            }''',
              '''            }.onFailure { error ->\n                if (error !is CancellationException && worker?.isCancelled != true) {\n                    logger?.log(0, diagnosticName, "Worker phát PCM dừng do lỗi", error)\n                }\n            }''',
          )

          # 4) Stop source first, then cancel its coroutine, and initialize system TTS only when needed.
          svc = "app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt"
          replace_once(
              svc,
              '''    private var tts: TextToSpeech? = null\n    private var ttsReady = false\n    private val ttsBuffer = StringBuilder()''',
              '''    private var tts: TextToSpeech? = null\n    private var ttsReady = false\n    private var ttsInitializing = false\n    private val ttsBuffer = StringBuilder()''',
          )
          replace_once(
              svc,
              '''        tts = TextToSpeech(applicationContext) { status ->\n            ttsReady = status == TextToSpeech.SUCCESS\n            if (!ttsReady) logger.log(1, "TTS", "Không khởi tạo được TextToSpeech, mã=$status")\n        }''',
              '''        if (!settings.aiVoice) ensureTtsInitialized()''',
          )
          replace_once(
              svc,
              '''        sourceJob?.cancel(); sourceJob = null\n        source?.stop(); source = null''',
              '''        source?.stop(); source = null\n        sourceJob?.cancel(); sourceJob = null''',
          )
          replace_once(
              svc,
              '''        if (_state.value.running) {\n            if (enabled && aiPlayer == null) {\n                aiPlayer = buildAiPlayer().also { it.start(); it.setVolume(settings.translatedVolume) }\n            } else if (!enabled) {\n                aiPlayer?.stop(); aiPlayer = null\n            }\n        }\n        updateState { it.copy(aiVoice = enabled) }''',
              '''        if (_state.value.running) {\n            if (enabled && aiPlayer == null) {\n                aiPlayer = buildAiPlayer().also { it.start(); it.setVolume(settings.translatedVolume) }\n            } else if (!enabled) {\n                aiPlayer?.stop(); aiPlayer = null\n            }\n        }\n        if (!enabled) ensureTtsInitialized()\n        updateState { it.copy(aiVoice = enabled) }''',
          )
          replace_once(
              svc,
              '''    private fun queueTts(text: String) {\n        if (!ttsReady) return''',
              '''    private fun ensureTtsInitialized() {\n        if (ttsReady || ttsInitializing) return\n        ttsInitializing = true\n        runCatching { tts?.shutdown() }\n        tts = null\n        tts = TextToSpeech(applicationContext) { status ->\n            ttsInitializing = false\n            ttsReady = status == TextToSpeech.SUCCESS\n            if (ttsReady) {\n                logger.log(2, "TTS", "TextToSpeech đã sẵn sàng")\n            } else {\n                logger.log(1, "TTS", "Không khởi tạo được TextToSpeech, mã=$status")\n            }\n        }\n    }\n\n    private fun queueTts(text: String) {\n        if (!ttsReady) return''',
          )
          replace_once(
              svc,
              '''        runCatching { tts?.shutdown() }\n        tts = null\n        serviceScope.cancel()''',
              '''        runCatching { tts?.shutdown() }\n        tts = null\n        ttsReady = false\n        ttsInitializing = false\n        serviceScope.cancel()''',
          )

          # Document the behavior change.
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## Chưa phát hành\n"
          addition = """\n### Nhật ký và tua tệp\n\n- Không còn ghi lỗi đỏ khi WebSocket, decoder hoặc AudioTrack bị hủy chủ động do tua hoặc dừng phiên.\n- Hai lần tua liên tiếp được cộng dồn đúng khoảng thời gian thay vì lần sau ghi đè lần trước.\n- Chỉ khởi tạo TextToSpeech hệ thống khi người dùng dùng giọng đọc của điện thoại; có thể thử lại khi chuyển sang chế độ này.\n"""
          if addition.strip() not in text:
              if marker not in text:
                  raise SystemExit("CHANGELOG marker missing")
              text = text.replace(marker, marker + addition, 1)
              changelog.write_text(text, encoding="utf-8")
          PY

          git rm .github/workflows/apply-clean-cancellation-log-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/network/GeminiLiveClient.kt \
                  app/src/main/java/com/oai/geminilivetranslate/audio/FileAudioSource.kt \
                  app/src/main/java/com/oai/geminilivetranslate/audio/StreamingPcmPlayer.kt \
                  app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt \
                  CHANGELOG.md
          git commit -m "Fix expected cancellation logging [patched]"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:agent/clean-cancellation-logs
