name: Apply live setup patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          ref: fix/live-setup-and-stable-updates
          fetch-depth: 0

      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-patch/patch121.part* | base64 --decode > /tmp/patch121.tar.gz
          tar -xzf /tmp/patch121.tar.gz -C .
          rm -rf .ci-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix Gemini setup and stable APK update signing"
          git push origin HEAD:fix/live-setup-and-stable-updates
