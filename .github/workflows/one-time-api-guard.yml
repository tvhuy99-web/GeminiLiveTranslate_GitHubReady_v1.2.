name: One-time internal audio API guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Guard playback capture on Android 10+
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt")
          text = path.read_text()
          if "import android.os.Build\n" not in text:
              text = text.replace("import android.os.Binder\n", "import android.os.Binder\nimport android.os.Build\n", 1)
          old = "            SourceMode.INTERNAL -> InternalAudioSource(this, mediaProjection ?: return, logger)"
          new = """            SourceMode.INTERNAL -> {
                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                    stopTranslation(\"Thu âm thanh nội bộ yêu cầu Android 10 trở lên\")
                    return
                }
                InternalAudioSource(this, mediaProjection ?: return, logger)
            }"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Expected InternalAudioSource branch not found")
          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            echo "API guard is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          git commit -m "fix: guard playback capture behind Android 10"
          git push origin "HEAD:${{ github.head_ref }}"
