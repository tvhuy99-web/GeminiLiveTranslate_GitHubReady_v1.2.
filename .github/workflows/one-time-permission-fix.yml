name: One-time audio permission fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Add explicit RECORD_AUDIO checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          internal = Path("app/src/main/java/com/oai/geminilivetranslate/audio/InternalAudioSource.kt")
          text = internal.read_text()
          text = text.replace(
              "package com.oai.geminilivetranslate.audio\n\nimport android.media.AudioAttributes",
              "package com.oai.geminilivetranslate.audio\n\nimport android.Manifest\nimport android.annotation.SuppressLint\nimport android.content.Context\nimport android.content.pm.PackageManager\nimport android.media.AudioAttributes",
              1,
          )
          text = text.replace(
              "import androidx.annotation.RequiresApi\n",
              "import androidx.annotation.RequiresApi\nimport androidx.core.content.ContextCompat\n",
              1,
          )
          text = text.replace(
              "class InternalAudioSource(\n    private val mediaProjection: MediaProjection,",
              "class InternalAudioSource(\n    private val context: Context,\n    private val mediaProjection: MediaProjection,",
              1,
          )
          text = text.replace(
              "    override suspend fun run(listener: AudioSource.Listener) {\n        val projectionCallback",
              "    @SuppressLint(\"MissingPermission\") // Permission is checked immediately below.\n    override suspend fun run(listener: AudioSource.Listener) {\n        requireRecordAudioPermission()\n        val projectionCallback",
              1,
          )
          text = text.replace(
              "    private fun createRecorder(capture: AudioPlaybackCaptureConfiguration): Pair<AudioRecord, CaptureConfig> {",
              "    private fun requireRecordAudioPermission() {\n        if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n            throw SecurityException(\"Chưa cấp quyền microphone cần thiết để thu âm thanh nội bộ.\")\n        }\n    }\n\n    @SuppressLint(\"MissingPermission\") // run() verifies RECORD_AUDIO before calling this helper.\n    private fun createRecorder(capture: AudioPlaybackCaptureConfiguration): Pair<AudioRecord, CaptureConfig> {",
              1,
          )
          internal.write_text(text)

          mic = Path("app/src/main/java/com/oai/geminilivetranslate/audio/MicAudioSource.kt")
          text = mic.read_text()
          text = text.replace(
              "package com.oai.geminilivetranslate.audio\n\nimport android.media.AudioFormat",
              "package com.oai.geminilivetranslate.audio\n\nimport android.Manifest\nimport android.annotation.SuppressLint\nimport android.content.Context\nimport android.content.pm.PackageManager\nimport android.media.AudioFormat",
              1,
          )
          text = text.replace(
              "import com.oai.geminilivetranslate.core.SessionLogger\n",
              "import androidx.core.content.ContextCompat\nimport com.oai.geminilivetranslate.core.SessionLogger\n",
              1,
          )
          text = text.replace(
              "class MicAudioSource(private val logger: SessionLogger? = null) : AudioSource {",
              "class MicAudioSource(\n    private val context: Context,\n    private val logger: SessionLogger? = null,\n) : AudioSource {",
              1,
          )
          text = text.replace(
              "    override suspend fun run(listener: AudioSource.Listener) {\n        try {",
              "    @SuppressLint(\"MissingPermission\") // Permission is checked immediately below.\n    override suspend fun run(listener: AudioSource.Listener) {\n        try {\n            requireRecordAudioPermission()",
              1,
          )
          text = text.replace(
              "    private fun createRecorder(): Pair<AudioRecord, CaptureConfig> {",
              "    private fun requireRecordAudioPermission() {\n        if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {\n            throw SecurityException(\"Chưa cấp quyền microphone.\")\n        }\n    }\n\n    @SuppressLint(\"MissingPermission\") // run() verifies RECORD_AUDIO before calling this helper.\n    private fun createRecorder(): Pair<AudioRecord, CaptureConfig> {",
              1,
          )
          mic.write_text(text)

          service = Path("app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt")
          text = service.read_text()
          text = text.replace("SourceMode.MICROPHONE -> MicAudioSource(logger)", "SourceMode.MICROPHONE -> MicAudioSource(this, logger)", 1)
          text = text.replace("SourceMode.INTERNAL -> InternalAudioSource(mediaProjection ?: return, logger)", "SourceMode.INTERNAL -> InternalAudioSource(this, mediaProjection ?: return, logger)", 1)
          service.write_text(text)

          for path in (internal, mic, service):
              content = path.read_text()
              if "USAGE_ACCESSIBILITY" in content:
                  raise SystemExit(f"Obsolete audio usage remains in {path}")
          PY
          git diff --check
          if git diff --quiet; then
            echo "Permission checks are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/audio/InternalAudioSource.kt \
                  app/src/main/java/com/oai/geminilivetranslate/audio/MicAudioSource.kt \
                  app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          git commit -m "fix: validate RECORD_AUDIO before creating capture sources"
          git push origin "HEAD:${{ github.head_ref }}"
