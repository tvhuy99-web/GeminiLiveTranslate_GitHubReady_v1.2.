name: R18.10 Upload RPC Trace

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1810-upload-rpc-trace.yml

permissions:
  contents: write

jobs:
  build-r1810:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply R18.10 source patch
        shell: bash
        run: |
          set -uo pipefail
          python3 tools/apply_r1810_upload_rpc_trace.py || true
          python3 tools/finish_r1810_upload_rpc_trace.py

      - name: Verify R18.10 invariants
        shell: bash
        run: |
          set -euo pipefail
          REQ=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          EXEC=app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          VIDEO=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          grep -F '2026-09-05-web-session-r11.8-upload-rpc-trace' "$REQ"
          grep -F 'R20_ATTACHMENT_FILE_READ_DONE' "$REQ"
          grep -F 'R20_ATTACHMENT_PAYLOAD_START' "$REQ"
          grep -F 'R20_ATTACHMENT_PAYLOAD_PROGRESS' "$REQ"
          grep -F 'R20_ATTACHMENT_PAYLOAD_RESULT' "$REQ"
          grep -F 'attachmentPrepared=present&&!busy&&localReadReady&&submitReady' "$REQ"
          grep -F 'serverPayloadObserved=fix.attachmentPayloadStarted>0' "$REQ"
          grep -F 'R20_ATTACHMENT_WAIT_PREPARED' "$EXEC"
          grep -F 'R20_ATTACHMENT_PREPARED' "$EXEC"
          grep -F 'autoSubmit=false' "$VIDEO"
          if grep -F 'ACTION_TAP_DOWN purpose=video-generate' "$VIDEO"; then
            echo 'Video auto-submit marker unexpectedly present' >&2
            exit 1
          fi

      - name: Check embedded JavaScript syntax
        run: python3 tools/check_embedded_js_syntax.py

      - name: Unit test, assemble and lint
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean testDebugUnitTest assembleDebug lintDebug --stacktrace

      - name: Verify APK and new digest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          echo "APK_SIZE=$SIZE"
          echo "APK_SHA256=$SHA"
          if [ "$SHA" = 'f76bdb1b2252074808654ba1eab34a96d5d5b621979672b7bca224a9ac3aa94c' ]; then
            echo 'R18.10 APK unexpectedly matches R18.9' >&2
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" GeminiLiveTranslate-R18.10-upload-rpc-trace.apk
          sha256sum GeminiLiveTranslate-R18.10-upload-rpc-trace.apk > GeminiLiveTranslate-R18.10-upload-rpc-trace.sha256

      - name: Commit validated R18.10 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt \
            app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt \
            app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          git commit -m 'R18.10: trace local file read and server payload lifecycle'
          git push origin HEAD:experiment/aistudio-r183-network-vi

      - name: Upload R18.10 APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.10-upload-rpc-trace
          path: |
            GeminiLiveTranslate-R18.10-upload-rpc-trace.apk
            GeminiLiveTranslate-R18.10-upload-rpc-trace.sha256
          if-no-files-found: error
