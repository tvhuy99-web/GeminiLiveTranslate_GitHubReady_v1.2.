name: R18.12.1 Visible R22 Logs

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r18121-visible-r22-logs.yml

permissions:
  contents: write

env:
  BRANCH_NAME: experiment/aistudio-r183-network-vi
  APK_NAME: GeminiLiveTranslate-R18.12.1-auto-video-manual-transcribe-visible-trace.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply visible-log patch
        run: python3 tools/r18121_patch.py
      - name: Verify behavior and log invariants
        run: |
          set -euxo pipefail
          VIDEO=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          TRANS=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          EXEC=app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          REQ=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -F 'R22_VIDEO_AUTO_SUBMIT_AFTER_READY' "$VIDEO"
          grep -F 'generateAttachmentNativeOnly(prompt = prompt)' "$VIDEO"
          grep -F 'requireUploadReady = true' "$VIDEO"
          grep -F 'awaitManualAttachmentFileOnlyGenerate' "$TRANS"
          grep -F 'manualRun=true' "$TRANS"
          grep -F 'JS_R22_' "$VIDEO"
          grep -F 'JS_R22_' "$TRANS"
          grep -F 'R22_FILE_TRANSCRIBE_MANUAL_ARMED' "$EXEC"
          grep -F 'R22_GENERATE_REQUEST_SHAPE' "$REQ"
          grep -F 'R22_GENERATE_RESPONSE_ERROR' "$REQ"
      - name: Build, test, lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee r18121-sha256.txt
          stat -c '%s bytes' "$APK_NAME" | tee r18121-size.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK_NAME" | head -5 | tee r18121-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee r18121-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' r18121-signature.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' r18121-signature.txt
      - name: Commit logging fix
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java
          if ! git diff --cached --quiet; then
            git commit -m 'fix: surface R22 manual trace logs'
            git push origin HEAD:${BRANCH_NAME}
          fi
          git rev-parse HEAD | tee r18121-source-head.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.12.1-auto-video-manual-transcribe-visible-trace
          path: |
            ${{ env.APK_NAME }}
            r18121-sha256.txt
            r18121-size.txt
            r18121-badging.txt
            r18121-signature.txt
            r18121-source-head.txt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup one-shot files
        if: success()
        run: |
          set -euxo pipefail
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/r18121_patch.py .github/workflows/r18121-visible-r22-logs.yml
          git commit -m 'chore: remove one-shot R18.12.1 build helpers'
          git push origin HEAD:${BRANCH_NAME}
