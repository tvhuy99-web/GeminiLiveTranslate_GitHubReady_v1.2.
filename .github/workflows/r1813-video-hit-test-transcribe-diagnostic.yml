name: R18.13 Video Hit Test + Transcribe Diagnostic

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1813-video-hit-test-transcribe-diagnostic.yml

permissions:
  contents: write

env:
  BRANCH_NAME: experiment/aistudio-r183-network-vi
  APK_NAME: GeminiLiveTranslate-R18.13-video-hit-test-transcribe-diagnostic.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply R18.13 patch
        run: python3 tools/r1813_patch.py
      - name: Verify R18.13 invariants
        run: |
          set -euxo pipefail
          SUBMIT=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetFix.kt
          REQ=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          EXEC=app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          VIDEO=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          TRANS=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          grep -F 'r11.9-cached-hit-test-submit' "$SUBMIT"
          grep -F 'R23_PREPARED_SUBMIT_TARGET' "$SUBMIT"
          grep -F 'R23_NATIVE_SUBMIT_HIT_TEST' "$SUBMIT"
          grep -F 'document.elementFromPoint' "$SUBMIT"
          grep -F 'cachedPreparedTarget' "$SUBMIT"
          grep -F 'programmaticFallback=true' "$EXEC"
          grep -F 'allowProgrammaticFallback = true' "$EXEC"
          grep -F 'r11.11-http-rpc-diagnostic' "$REQ"
          grep -F 'R23_GENERATE_HTTP_DIAGNOSTIC' "$REQ"
          grep -F 'summarizeGenerateBody' "$REQ"
          grep -F 'requestHeaderNames' "$REQ"
          grep -F 'JS_R23_' "$VIDEO"
          grep -F 'JS_R23_' "$TRANS"
          grep -F 'awaitManualAttachmentFileOnlyGenerate' "$TRANS"
          grep -F 'manualRun=true' "$TRANS"
          grep -F 'autoSubmit=true' "$VIDEO"
          ! grep -F 'generateAttachmentFileOnlyNative' "$TRANS"
      - name: Check embedded JavaScript syntax
        run: python3 tools/check_embedded_js_syntax.py
      - name: Build, test, lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee r1813-sha256.txt
          stat -c '%s bytes' "$APK_NAME" | tee r1813-size.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK_NAME" | head -5 | tee r1813-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee r1813-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' r1813-signature.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' r1813-signature.txt
      - name: Commit validated R18.13 source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          if ! git diff --cached --quiet; then
            git commit -m 'R18.13: robust video submit and transcribe diagnostics'
            git push origin HEAD:${BRANCH_NAME}
          fi
          git rev-parse HEAD | tee r1813-source-head.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.13-video-hit-test-transcribe-diagnostic
          path: |
            ${{ env.APK_NAME }}
            r1813-sha256.txt
            r1813-size.txt
            r1813-badging.txt
            r1813-signature.txt
            r1813-source-head.txt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup one-shot files
        if: success()
        run: |
          set -euxo pipefail
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/r1813_patch.py .github/workflows/r1813-video-hit-test-transcribe-diagnostic.yml
          git commit -m 'chore: remove one-shot R18.13 build helpers'
          git push origin HEAD:${BRANCH_NAME}
