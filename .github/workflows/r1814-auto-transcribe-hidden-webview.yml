name: R18.14 Auto Transcribe + Hidden WebView

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1814-auto-transcribe-hidden-webview.yml

permissions:
  contents: write

env:
  BRANCH_NAME: experiment/aistudio-r183-network-vi
  APK_NAME: GeminiLiveTranslate-R18.14-auto-transcribe-hidden-webview.apk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply R18.14 patch
        run: python3 tools/r1814_patch.py
      - name: Verify R18.14 invariants
        run: |
          set -euxo pipefail
          PREF=app/src/main/java/com/oai/geminilivetranslate/core/AppPreferences.kt
          SETTINGS=app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt
          HOST=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioNativeTapDebugSupport.kt
          TRANS=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          EXEC=app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          SUBMIT=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetFix.kt
          grep -F 'loadAiStudioWebViewVisible(): Boolean = prefs.getBoolean(KEY_AI_STUDIO_WEBVIEW_VISIBLE, false)' "$PREF"
          grep -F 'Hiển thị trang web AI Studio' "$SETTINGS"
          grep -F 'setVisibleForActive(visible, logger)' "$SETTINGS"
          grep -F 'r18.14-toggle-hidden-webview-debug' "$HOST"
          grep -F 'IMPORTANT_FOR_ACCESSIBILITY_NO_HIDE_DESCENDANTS' "$HOST"
          grep -F 'panel.translationY = if (visible) 0f else' "$HOST"
          grep -F 'R24_WEBVIEW_PRESENTATION' "$HOST"
          grep -F 'manualRun=false autoSubmit=true' "$TRANS"
          grep -F 'generateAttachmentFileOnlyNative' "$TRANS"
          grep -F 'R24_FILE_TRANSCRIBE_ATTACH_RETRY' "$TRANS"
          grep -F 'R24_FILE_TRANSCRIBE_AUTO_SUBMIT_POLICY' "$EXEC"
          grep -F 'r11.10-file-only-hit-test' "$SUBMIT"
          grep -F 'R24_FILE_ONLY_NATIVE_HIT_TEST' "$SUBMIT"
          ! grep -F 'awaitManualAttachmentFileOnlyGenerate' "$TRANS"
          ! grep -F 'manualRun=true' "$TRANS"
      - name: Check embedded JavaScript syntax
        run: python3 tools/check_embedded_js_syntax.py
      - name: Build, test, lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug
      - name: Verify APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" | tee r1814-sha256.txt
          stat -c '%s bytes' "$APK_NAME" | tee r1814-size.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK_NAME" | head -5 | tee r1814-badging.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee r1814-signature.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' r1814-signature.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' r1814-signature.txt
      - name: Commit validated R18.14 source
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java app/src/test/java
          if ! git diff --cached --quiet; then
            git commit -m 'R18.14: auto file transcribe and hidden AI Studio debug view'
            git push origin HEAD:${BRANCH_NAME}
          fi
          git rev-parse HEAD | tee r1814-source-head.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.14-auto-transcribe-hidden-webview
          path: |
            ${{ env.APK_NAME }}
            r1814-sha256.txt
            r1814-size.txt
            r1814-badging.txt
            r1814-signature.txt
            r1814-source-head.txt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup one-shot files
        if: success()
        run: |
          set -euxo pipefail
          git fetch origin "$BRANCH_NAME"
          git checkout "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f tools/r1814_patch.py .github/workflows/r1814-auto-transcribe-hidden-webview.yml
          git commit -m 'chore: remove one-shot R18.14 build helpers'
          git push origin HEAD:${BRANCH_NAME}
