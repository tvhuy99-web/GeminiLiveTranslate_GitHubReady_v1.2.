name: R18.15 Transcribe No Thinking + UI Cleanup

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - tools/apply_r1815_transcribe_no_thinking_ui_cleanup.py
      - .github/workflows/r1815-transcribe-no-thinking-ui-cleanup.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply R18.15 patch
        run: python3 tools/apply_r1815_transcribe_no_thinking_ui_cleanup.py

      - name: Verify R18.15 invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q '2026-09-05-web-session-r11.12-transcribe-no-thinking' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -q 'R25_TRANSCRIBE_THINKING_STRIPPED' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -q 'generation\[16\] = null' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          ! grep -q 'Mặc định tắt. Chỉ bật khi cần xem trực tiếp trang AI Studio' app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt
          ! grep -q 'Công tắc này chỉ thay đổi cách hiển thị trang gỡ lỗi' app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt
          grep -q 'geminiKeyFields.isVisible = !aiStudio' app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt
          grep -q 'R24_FILE_TRANSCRIBE_AUTO_SUBMIT_START' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          echo 'R18.15 source invariants PASS'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Commit validated R18.15 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/SettingsActivity.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt \
            app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'R18.15: disable transcribe thinking and simplify AI settings'
            git push origin HEAD:experiment/aistudio-r183-network-vi
          fi
          git rev-parse HEAD | tee /tmp/source_commit.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.15-transcribe-no-thinking-ui-cleanup.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.15-transcribe-no-thinking-ui-cleanup
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup one-shot R18.15 files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin experiment/aistudio-r183-network-vi
          git rm -f tools/apply_r1815_transcribe_no_thinking_ui_cleanup.py .github/workflows/r1815-transcribe-no-thinking-ui-cleanup.yml
          git commit -m 'chore: remove one-shot R18.15 build helpers'
          git push origin HEAD:experiment/aistudio-r183-network-vi
