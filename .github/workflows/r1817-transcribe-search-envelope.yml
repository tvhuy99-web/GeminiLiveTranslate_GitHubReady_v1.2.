name: R18.17 Transcribe Search Envelope

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - tools/apply_r1817_transcribe_search_envelope.py
      - .github/workflows/r1817-transcribe-search-envelope.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply R18.17 patch
        run: python3 tools/apply_r1817_transcribe_search_envelope.py

      - name: Verify R18.17 source invariants
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -q '2026-09-05-web-session-r11.14-transcribe-no-search-envelope' "$SRC"
          grep -q 'R27_TRANSCRIBE_SEARCH_ENVELOPE_STRIPPED' "$SRC"
          grep -q 'R27_TRANSCRIBE_SEARCH_ENVELOPE_NOOP' "$SRC"
          grep -Fq 'root[6] = []' "$SRC"
          grep -Fq 'searchEnvelopeSlot:{kind:'"'"'unknown'"'"',count:-1,shape:null}' "$SRC"
          grep -Fq 'stripUnsupportedTranscribeSearchEnvelope(rewritten, source)' "$SRC"
          grep -q 'R26_TRANSCRIBE_TOOLS_STRIPPED' "$SRC"
          grep -q 'R25_TRANSCRIBE_THINKING_STRIPPED' "$SRC"
          echo 'R18.17 source invariants PASS'

      - name: Check embedded request-fix JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt')
          s = p.read_text()
          marker = 'val DOCUMENT_START: String = """'
          a = s.index(marker) + len(marker)
          b = s.index('""".trimIndent()', a)
          js = s[a:b]
          Path('/tmp/r1817-request-fix.js').write_text(js)
          print(f'extracted_js_chars={len(js)}')
          PY
          node --check /tmp/r1817-request-fix.js
          echo 'R18.17 embedded JS syntax PASS'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Commit validated R18.17 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt \
            app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'R18.17: strip AI Studio search envelope from file transcribe'
            git push origin HEAD:experiment/aistudio-r183-network-vi
          fi
          git rev-parse HEAD | tee /tmp/source_commit.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.17-transcribe-no-search-envelope.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.17-transcribe-no-search-envelope
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup one-shot R18.17 files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git restore gradlew || true
          git rm -f tools/apply_r1817_transcribe_search_envelope.py .github/workflows/r1817-transcribe-search-envelope.yml
          git commit -m 'chore: remove one-shot R18.17 build helpers'
          git push origin HEAD:experiment/aistudio-r183-network-vi
