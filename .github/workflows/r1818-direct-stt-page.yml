name: R18.18 Direct STT Page

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1818-direct-stt-page.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply R18.18 patch
        run: python3 tools/apply_r1818_direct_stt_page.py

      - name: Verify R18.18 source invariants
        shell: bash
        run: |
          set -euo pipefail
          C=app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          E=app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          B=app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt
          grep -Fq 'startFileTranscribe(model)' "$C"
          grep -Fq 'attachSttFile' "$C"
          grep -Fq 'generateSttFileNative' "$C"
          ! grep -Fq 'selectModel(exec)' "$C"
          grep -Fq '/u/0/prompts/new_chat?model=' "$E"
          grep -Fq '2026-09-05-web-session-r12.6-direct-stt-page' "$E"
          grep -Fq 'AiStudioSttPageBridge.DOCUMENT_START' "$E"
          grep -Fq 'R28_STT_NETWORK_COMPLETE_EMPTY' "$E"
          grep -Fq 'ms-stt-zero-state' "$B"
          grep -Fq 'data-test-upload-file-input' "$B"
          grep -Fq 'R28_STT_RESULT_STATE' "$B"
          echo 'R18.18 source invariants PASS'

      - name: Check embedded STT JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt')
          s=p.read_text(); marker='val DOCUMENT_START: String = """'; a=s.index(marker)+len(marker); b=s.index('""".trimIndent()',a)
          js=s[a:b].replace("$VERSION", "2026-09-05-stt-page-r1-direct-model")
          Path('/tmp/r1818-stt.js').write_text(js)
          print('stt_js_chars',len(js))
          PY
          node --check /tmp/r1818-stt.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK and signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Commit validated R18.18 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt \
            app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt \
            app/src/test/java/com/oai/geminilivetranslate/network/AiStudioDirectSttPageSourceTest.kt
          if ! git diff --cached --quiet; then
            git commit -m 'R18.18: use dedicated AI Studio STT model page'
            git push origin HEAD:experiment/aistudio-r183-network-vi
          fi
          git rev-parse HEAD | tee /tmp/source_commit.txt

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.18-direct-stt-page.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.18-direct-stt-page
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup one-shot R18.18 files
        run: |
          set -euo pipefail
          git restore gradlew || true
          git rm -f tools/apply_r1818_direct_stt_page.py .github/workflows/r1818-direct-stt-page.yml
          git commit -m 'chore: remove one-shot R18.18 build helpers'
          git push origin HEAD:experiment/aistudio-r183-network-vi
