name: R18.19 STT Regex Fix

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt
      - .github/workflows/r1819-stt-regex-fix.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 1

      - name: Verify STT bridge runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt')
          s=p.read_text()
          marker='val DOCUMENT_START: String = """'
          a=s.index(marker)+len(marker)
          b=s.index('""".trimIndent()',a)
          js=s[a:b].replace('$VERSION','2026-09-05-stt-page-r2-regex-runtime-fix')
          Path('/tmp/stt-r2.js').write_text(js)
          assert "replace(/^models\\//i" in js
          assert "replace(/\\s+/g" in js
          assert "split(/\\r?\\n/)" in js
          assert "PAGE_STATE_EXCEPTION" in js
          PY
          node --check /tmp/stt-r2.js
          node - <<'JS'
          global.window={AIStudioWebSessionLab:{onJsEvent:()=>{}}};
          global.location={href:'https://aistudio.google.com/u/0/prompts/new_chat?model=gemini-3.5-transcribe',pathname:'/u/0/prompts/new_chat'};
          global.document={querySelector:(s)=>s==='ms-stt-zero-state'?{}:null,body:{innerText:'Turn speech to transcriptions'},querySelectorAll:()=>[]};
          global.URL=URL; global.getComputedStyle=()=>({display:'block',visibility:'visible'}); global.innerWidth=1000; global.innerHeight=800;
          require('/tmp/stt-r2.js');
          const r=window.__AIS_STT_PAGE__.pageState('gemini-3.5-transcribe');
          if(!r || !r.ready || r.urlModel!=='gemini-3.5-transcribe') throw new Error(JSON.stringify(r));
          console.log('STT pageState runtime PASS', JSON.stringify(r));
          JS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          git rev-parse HEAD | tee /tmp/source_commit.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.19-stt-regex-fix.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.19-stt-regex-fix
          path: out/
          if-no-files-found: error
          retention-days: 30
