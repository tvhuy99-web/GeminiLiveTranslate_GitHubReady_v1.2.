name: R18.22 STT Accessibility Touch Guard

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt
      - app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
      - .github/workflows/r1822-stt-accessibility-touch-guard.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 1

      - name: Verify accessibility-safe STT activation and result guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt').read_text()
          marker='val DOCUMENT_START: String = """'
          a=bridge.index(marker)+len(marker)
          b=bridge.index('""".trimIndent()',a)
          js=bridge[a:b].replace('$VERSION','2026-09-05-stt-page-r5-accessibility-touch-guard')
          Path('/tmp/stt-r5.js').write_text(js)
          executor=Path('app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt').read_text()
          start=executor.index('private fun trySttRunSubmit')
          end=executor.index('private fun pollSttResult', start)
          run_path=executor[start:end]
          assert 'nativeTapController.requestNativeTap' in run_path
          assert '.click()' not in run_path
          assert 'performAccessibilityAction' not in run_path
          assert "activationPolicy='native-touch-only'" in js
          assert 'R30_STT_RUN_GESTURE' in js
          assert 'body-delta-after-network-success' in js
          PY
          node --check /tmp/stt-r5.js
          node - <<'JS'
          let scrolled=false;
          let transcriptNode=null;
          const root={tagName:'MS-STT-WORKSPACE',className:'stt-workspace',id:'',parentElement:null,getAttribute:()=>null};
          const start={
            tagName:'BUTTON',textContent:'Transcribe',className:'stt-transcribe-button ms-button-primary',id:'',parentElement:root,isConnected:true,disabled:false,
            getAttribute:(k)=>k==='aria-disabled'?'false':null,
            getBoundingClientRect:()=>scrolled?({left:40,top:300,right:380,bottom:348,width:340,height:48}):({left:40,top:805,right:380,bottom:853,width:340,height:48}),
            scrollIntoView:()=>{scrolled=true;},contains:(n)=>n===start
          };
          const body={innerText:'Turn speech to transcriptions\nsample.m4a\nTranscribe\nSomething went wrong'};
          global.window={AIStudioWebSessionLab:{onJsEvent:()=>{}},__AIS_WEB_SESSION__:{captureCount:0,getLastSafeResponse:()=>null}};
          global.location={href:'https://aistudio.google.com/u/0/prompts/new_chat?model=gemini-3.5-transcribe',pathname:'/u/0/prompts/new_chat'};
          global.document={
            documentElement:{clientWidth:423,clientHeight:407},
            querySelector:(s)=>s==='ms-stt-zero-state'?{}:null,
            querySelectorAll:(s)=>s.includes('ms-stt-transcription')?(transcriptNode?[transcriptNode]:[]):[start],
            body,
            elementFromPoint:()=>scrolled?start:null,
            addEventListener:()=>{}
          };
          global.URL=URL;
          global.getComputedStyle=()=>({display:'block',visibility:'visible'});
          global.innerWidth=423; global.innerHeight=407;
          require('/tmp/stt-r5.js');
          window.__AIS_STT_PAGE__.markFileChooserServed('sample.m4a','audio/mp4',1234);
          const target=window.__AIS_STT_PAGE__.runTarget();
          if(!target.ok || !target.scrolled || target.activationPolicy!=='native-touch-only') throw new Error(JSON.stringify(target));
          const errorState=window.__AIS_STT_PAGE__.resultState();
          if(errorState.text) throw new Error('short error leaked as transcript '+JSON.stringify(errorState));
          transcriptNode={isConnected:true,innerText:'Xin chào.',textContent:'Xin chào.',getAttribute:()=>null,getBoundingClientRect:()=>({left:20,top:120,right:300,bottom:160,width:280,height:40})};
          const transcriptState=window.__AIS_STT_PAGE__.resultState();
          if(transcriptState.text!=='Xin chào.' || transcriptState.source!=='stt-dom') throw new Error('dedicated transcript rejected '+JSON.stringify(transcriptState));
          console.log('R18.22 accessibility/result guard PASS',JSON.stringify({target,errorState,transcriptState}));
          JS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          git rev-parse HEAD | tee /tmp/source_commit.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.22-stt-accessibility-touch-guard.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.22-stt-accessibility-touch-guard
          path: out/
          if-no-files-found: error
          retention-days: 30
