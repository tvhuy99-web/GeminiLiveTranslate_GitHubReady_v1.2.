name: R18.25 Clean Production Verification

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1823b-stt-visible-dom-fallback-build.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify production source markers
        run: |
          test ! -e tools/r1825_apply.py
          grep -q R33_SELECTED_FILE_PERSISTED app/src/main/java/com/oai/geminilivetranslate/MainActivity.kt
          grep -q R33_SELECTED_FILE_RESTORED app/src/main/java/com/oai/geminilivetranslate/MainActivity.kt
          grep -q R34_VIDEO_MODEL_LIST_WEB_START app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioModelCatalogLoader.kt
          grep -q 'Gemini API dự phòng' app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt
          echo 'd0a5de09fcce511d7eafff5c3772bc7f1f32450baa59b8441ca532b560051d4a  app/src/main/java/com/oai/geminilivetranslate/MainActivity.kt' | sha256sum -c -
          echo 'b165f4d90ec4d5343010548e78fc221115888fe0478bc2135e2fa39048d72082  app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt' | sha256sum -c -
          echo '0b535f564aaf5b12b961b67aa071418c2fc3b613f7bd303d33a6bc7c3693c142  app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioModelCatalogLoader.kt' | sha256sum -c -

      - name: Repository verification
        run: |
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py

      - name: Android test assemble lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 tools/verify_apk.py "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/GeminiLiveTranslate-R18.25-selected-file-video-models.apk
          git rev-parse HEAD > artifact/source_commit.txt
          sha256sum artifact/GeminiLiveTranslate-R18.25-selected-file-video-models.apk > artifact/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.25-selected-file-video-models
          path: artifact/
          if-no-files-found: error
