name: R18.26 Video Partial Streaming Build

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1823b-stt-visible-dom-fallback-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply R18.26 video partial streaming patch
        run: |
          python3 tools/r1826_apply.py
          sed -i 's/2026-09-05-web-session-r12.6-direct-stt-page/2026-09-05-web-session-r12.7-video-partial-stream/g' app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          sed -i 's/2026-09-05-web-session-r12.6-direct-stt-page/2026-09-05-web-session-r12.7-video-partial-stream/g' app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR12R1SourceTest.kt
          git diff --check
          grep -q R35_VIDEO_PARTIAL_RAW app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          grep -q R35_VIDEO_PARTIAL_UI app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          grep -q ATTACHMENT_PARTIAL_POLL_MS app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          grep -q streamingTextForUi app/src/test/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionStreamingTest.kt
          grep -q '2026-09-05-web-session-r12.7-video-partial-stream' app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          grep -q '2026-09-05-web-session-r12.7-video-partial-stream' app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR12R1SourceTest.kt
          # Keep every legacy source invariant; R18.26 changes only the executor version expectation.

      - name: Repository verification
        run: |
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py

      - name: Android test assemble lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 tools/verify_apk.py "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Commit verified R18.26 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          git add app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          git add app/src/test/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionStreamingTest.kt
          git add app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetSourceTest.kt
          git add app/src/test/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR12R1SourceTest.kt
          git commit -m 'R18.26: stream AI Studio video description partials'
          git push origin HEAD:experiment/aistudio-r183-network-vi

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/GeminiLiveTranslate-R18.26-video-partial-streaming.apk
          git rev-parse HEAD > artifact/source_commit.txt
          sha256sum artifact/GeminiLiveTranslate-R18.26-video-partial-streaming.apk > artifact/sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.26-video-partial-streaming
          path: artifact/
          if-no-files-found: error
