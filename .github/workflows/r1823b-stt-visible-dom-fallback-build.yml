name: R18.25 Commit Verified Source

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r1823b-stt-visible-dom-fallback-build.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate verified R18.25 source
        run: |
          python3 tools/r1825_apply.py
          git diff --check
          echo 'd0a5de09fcce511d7eafff5c3772bc7f1f32450baa59b8441ca532b560051d4a  app/src/main/java/com/oai/geminilivetranslate/MainActivity.kt' | sha256sum -c -
          echo 'b165f4d90ec4d5343010548e78fc221115888fe0478bc2135e2fa39048d72082  app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt' | sha256sum -c -
          echo '0b535f564aaf5b12b961b67aa071418c2fc3b613f7bd303d33a6bc7c3693c142  app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioModelCatalogLoader.kt' | sha256sum -c -

      - name: Commit verified production source
        run: |
          git config user.name 'tvhuy99-web'
          git config user.email 'tvhuy99@gmail.com'
          git add app/src/main/java/com/oai/geminilivetranslate/MainActivity.kt
          git add app/src/main/java/com/oai/geminilivetranslate/ui/ApiSettingsActivity.kt
          git add app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioModelCatalogLoader.kt
          git commit -m 'R18.25: persist selected file and load video models web-first'
          git push origin HEAD:experiment/aistudio-r183-network-vi
