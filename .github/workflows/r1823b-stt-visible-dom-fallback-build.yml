name: R18.24 STT Gate History Retention Build

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt
      - app/src/main/java/com/oai/geminilivetranslate/ui/HistoryActivity.kt
      - .github/workflows/r1823b-stt-visible-dom-fallback-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 1

      - name: Verify R18.24 post-2xx gate and history keepalive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioSttPageBridge.kt').read_text()
          marker='val DOCUMENT_START: String = """'
          a=bridge.index(marker)+len(marker)
          b=bridge.index('""".trimIndent()',a)
          js=bridge[a:b].replace('$VERSION','2026-09-05-stt-page-r7-post-2xx-delta-gate')
          Path('/tmp/stt-r7.js').write_text(js)
          for needle in ['preNetworkObserved','networkGateReset','changedAfterNetwork','R32_STT_RESULT_NETWORK_GATE']:
              assert needle in js, needle
          assert "activationPolicy='native-touch-only'" in js
          history=Path('app/src/main/java/com/oai/geminilivetranslate/ui/HistoryActivity.kt').read_text()
          for needle in ['R31_HISTORY_SERVICE_KEEPALIVE','bindService(','TranslationService::class.java','Context.BIND_AUTO_CREATE','unbindService(serviceKeepAliveConnection)']:
              assert needle in history, needle
          PY
          node --check /tmp/stt-r7.js
          node - <<'JS'
          let response=null;
          let scrolled=false;
          const root={tagName:'MS-STT-WORKSPACE',className:'stt-workspace',id:'',parentElement:null,getAttribute:()=>null};
          const start={tagName:'BUTTON',textContent:'Transcribe',className:'stt-transcribe-button ms-button-primary',id:'',parentElement:root,isConnected:true,disabled:false,getAttribute:(k)=>k==='aria-disabled'?'false':null,getBoundingClientRect:()=>scrolled?({left:40,top:300,right:380,bottom:348,width:340,height:48}):({left:40,top:805,right:380,bottom:853,width:340,height:48}),scrollIntoView:()=>{scrolled=true;},contains:(n)=>n===start};
          const baseline='Turn speech to transcriptions\nsample.m4a\nTranscribe';
          const stale='Waiting for text';
          const transcript='Đây là nội dung chép lời thật xuất hiện sau khi mạng đã trả HTTP 200.';
          const body={innerText:baseline+'\n'+stale};
          global.window={AIStudioWebSessionLab:{onJsEvent:()=>{}},__AIS_WEB_SESSION__:{captureCount:0,getLastSafeResponse:()=>response}};
          global.location={href:'https://aistudio.google.com/u/0/prompts/new_chat?model=gemini-3.5-transcribe',pathname:'/u/0/prompts/new_chat'};
          global.document={documentElement:{clientWidth:423,clientHeight:407},querySelector:(s)=>s==='ms-stt-zero-state'?{}:null,querySelectorAll:(s)=>s.includes('ms-stt-transcription')?[]:[start],body,elementFromPoint:()=>scrolled?start:null,addEventListener:()=>{}};
          global.URL=URL; global.getComputedStyle=()=>({display:'block',visibility:'visible'}); global.innerWidth=423; global.innerHeight=407;
          require('/tmp/stt-r7.js');
          window.__AIS_STT_PAGE__.markFileChooserServed('sample.m4a','audio/mp4',1234);
          const target=window.__AIS_STT_PAGE__.runTarget();
          if(!target.ok||target.activationPolicy!=='native-touch-only') throw new Error('target '+JSON.stringify(target));
          for(let i=0;i<5;i++){const pre=window.__AIS_STT_PAGE__.resultState();if(pre.text||pre.bodyDeltaStableScans!==0||pre.network2xxSeen)throw new Error('pre-network aged '+JSON.stringify(pre));}
          response={status:200,responseChars:18000,partial:true,ok:true};
          const gate=window.__AIS_STT_PAGE__.resultState();
          if(gate.text||!gate.networkGateReset||gate.changedAfterNetwork||gate.bodyDeltaStableScans!==0)throw new Error('gate '+JSON.stringify(gate));
          const staleAfter=window.__AIS_STT_PAGE__.resultState();
          if(staleAfter.text||staleAfter.changedAfterNetwork||staleAfter.bodyDeltaStableScans!==0)throw new Error('stale leaked '+JSON.stringify(staleAfter));
          body.innerText=baseline+'\n'+transcript;
          const first=window.__AIS_STT_PAGE__.resultState();
          if(first.text||!first.changedAfterNetwork||first.bodyDeltaStableScans!==1)throw new Error('first '+JSON.stringify(first));
          const second=window.__AIS_STT_PAGE__.resultState();
          if(second.text!==transcript||second.bodyDeltaStableScans!==2||!second.deltaUsable)throw new Error('second '+JSON.stringify(second));
          console.log('R18.24 specialized PASS',JSON.stringify({gate,staleAfter,first,second}));
          JS

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Full Android verification
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256
          git rev-parse HEAD | tee /tmp/source_commit.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" /tmp/badging.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/GeminiLiveTranslate-R18.24-stt-gate-history-file-retention.apk
          cp /tmp/apksigner.txt out/apksigner.txt
          cp /tmp/badging.txt out/badging.txt
          cp /tmp/apk.sha256 out/apk.sha256
          cp /tmp/source_commit.txt out/source_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.24-stt-gate-history-file-retention
          path: out/
          if-no-files-found: error
          retention-days: 30
