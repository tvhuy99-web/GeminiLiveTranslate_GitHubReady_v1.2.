name: R18.3 Bootstrap Hotfix Once

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi

permissions:
  contents: write

concurrency:
  group: r183-bootstrap-hotfix-once
  cancel-in-progress: false

jobs:
  patch-test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply exact R17.6 production hotfixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"patched {path}")

          r17 = "app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt"
          replace_once(
              r17,
              '    val DOCUMENT_START = """',
              '    val DOCUMENT_START: String = """',
          )
          replace_once(
              r17,
              "  function detectAuth(){try{const h=String(location.hostname||'').toLowerCase();state.authRequired=h.indexOf('accounts.google.')>=0||h==='accounts.google.com';}catch(_){}\n  function reportDiscovery(){",
              "  function detectAuth(){try{const h=String(location.hostname||'').toLowerCase();state.authRequired=h.indexOf('accounts.google.')>=0||h==='accounts.google.com';}catch(_){}}\n  function reportDiscovery(){",
          )

          checker = "tools/check_embedded_js_syntax.py"
          replace_once(
              checker,
              r'r"val\\s+([A-Za-z0-9_]*DOCUMENT_START[A-Za-z0-9_]*)\\s*:\\s*String\\s*=\\s*\\\"\\\"\\\"(.*?)\\\"\\\"\\\"\\.trimIndent\\(\\)",',
              r'r"val\\s+([A-Za-z0-9_]*DOCUMENT_START[A-Za-z0-9_]*)\\s*(?::\\s*String\\s*)?=\\s*\\\"\\\"\\\"(.*?)\\\"\\\"\\\"\\.trimIndent\\(\\)",',
          )

          p = Path(checker)
          text = p.read_text(encoding="utf-8")
          replace_marker = "    checked = 0\n    failures: list[str] = []\n"
          replacement = "    checked = 0\n    checked_blocks: set[str] = set()\n    failures: list[str] = []\n"
          if text.count(replace_marker) != 1:
              raise SystemExit("checker: checked marker mismatch")
          text = text.replace(replace_marker, replacement, 1)

          marker = "            name = match.group(1)\n            script = textwrap.dedent(match.group(2)).strip() + \"\\n\"\n            checked += 1\n"
          replacement = "            name = match.group(1)\n            script = textwrap.dedent(match.group(2)).strip() + \"\\n\"\n            checked += 1\n            checked_blocks.add(f\"{path.relative_to(ROOT)}:{name}\")\n"
          if text.count(marker) != 1:
              raise SystemExit("checker: match marker mismatch")
          text = text.replace(marker, replacement, 1)

          marker = "    if checked == 0:\n        print(\"[FAIL] no DOCUMENT_START JavaScript blocks found\", file=sys.stderr)\n        return 3\n\n"
          replacement = "    if checked == 0:\n        print(\"[FAIL] no DOCUMENT_START JavaScript blocks found\", file=sys.stderr)\n        return 3\n\n    required_r17 = \"app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt:DOCUMENT_START\"\n    if required_r17 not in checked_blocks:\n        print(f\"[FAIL] production R17.6 JavaScript was not syntax-checked: {required_r17}\", file=sys.stderr)\n        return 4\n\n"
          if text.count(marker) != 1:
              raise SystemExit("checker: required block marker mismatch")
          p.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          realtime = "app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt"
          p = Path(realtime)
          text = p.read_text(encoding="utf-8")
          old = '''    private fun bootstrapRecoveryScript(): String = """
        (function(){
          try{
            ${AiStudioWebSessionR17ProductionBootstrap.DOCUMENT_START}
            var r=window.__AIS_R17_PRODUCTION__;
            return JSON.stringify({ok:!!(r&&r.version),version:r&&String(r.version)||'',type:typeof r});
          }catch(e){
            return JSON.stringify({
              ok:false,
              name:String(e&&e.name||'Error'),
              message:String(e&&e.message||''),
              stack:String(e&&e.stack||'').slice(0,1400)
            });
          }
        })()
    """.trimIndent()
'''
          new = '''    private fun bootstrapRecoveryScript(): String {
        val source = JSONObject.quote(AiStudioWebSessionR17ProductionBootstrap.DOCUMENT_START)
        return """
            (function(){
              try{
                (0,eval)($source);
                var r=window.__AIS_R17_PRODUCTION__;
                return JSON.stringify({ok:!!(r&&r.version),version:r&&String(r.version)||'',type:typeof r});
              }catch(e){
                return JSON.stringify({
                  ok:false,
                  name:String(e&&e.name||'Error'),
                  message:String(e&&e.message||''),
                  stack:String(e&&e.stack||'').slice(0,1400)
                });
              }
            })()
        """.trimIndent()
    }
'''
          if text.count(old) != 1:
              raise SystemExit("AiStudioWebRealtimeClient: recovery script block mismatch")
          text = text.replace(old, new, 1)
          old = '                    val name = safe(result?.optString("name").orEmpty(), 80).ifBlank { "UnknownError" }\n                    val message = safe(result?.optString("message").orEmpty(), 500)\n'
          new = '                    val name = safe(result?.optString("name").orEmpty(), 80).ifBlank { "EvaluateJavascriptError" }\n                    val message = safe(result?.optString("message").orEmpty(), 500).ifBlank {\n                        if (rawInstall.isNullOrBlank() || rawInstall == "null") "evaluateJavascript returned null/empty"\n                        else "evaluateJavascript returned non-JSON: ${safe(rawInstall, 240)}"\n                    }\n'
          if text.count(old) != 1:
              raise SystemExit("AiStudioWebRealtimeClient: diagnostic fallback block mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          service = "app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt"
          p = Path(service)
          text = p.read_text(encoding="utf-8")
          old = '''    private fun handleConnectionError(error: Throwable) {
        logger.log(0, "Gemini", "Mất kết nối", error)
        val apiError = error as? GeminiLiveClient.GeminiApiException
'''
          new = '''    private fun handleConnectionError(error: Throwable) {
        logger.log(0, "Gemini", "Mất kết nối", error)
        val detail = error.message.orEmpty()
        val localAiStudioBootstrapFailure =
            detail.startsWith("R17_BOOTSTRAP_INSTALL_FAILED") ||
                detail.startsWith("AI_STUDIO_LIVE_SETUP_HARD_TIMEOUT") ||
                detail.startsWith("AI_STUDIO_LIVE_SETUP_STALLED")
        if (localAiStudioBootstrapFailure) {
            logger.log(0, "GeminiWS", "Không reconnect vì lỗi bootstrap AI Studio cục bộ: ${detail.take(500)}")
            stopTranslation("AI Studio gặp lỗi bootstrap cục bộ; xem nhật ký chẩn đoán")
            return
        }
        val apiError = error as? GeminiLiveClient.GeminiApiException
'''
          if text.count(old) != 1:
              raise SystemExit("TranslationService: handleConnectionError marker mismatch")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git diff --check
          git diff -- app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt tools/check_embedded_js_syntax.py app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt

      - name: Verify embedded JavaScript including R17.6
        run: python3 tools/check_embedded_js_syntax.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test lint and build APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug
          python3 tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt \
            app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt \
            tools/check_embedded_js_syntax.py
          git commit -m "R18.3: fix R17.6 bootstrap parse and fatal recovery" 
          git push origin HEAD:experiment/aistudio-r183-network-vi
          git rev-parse HEAD | tee HOTFIX_COMMIT.txt

      - name: Upload verified R18.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R183-bootstrap-hotfix-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            HOTFIX_COMMIT.txt
          if-no-files-found: error
          retention-days: 3
