name: R18.4 Publish Validated Source Patch Once

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi

permissions:
  contents: write

jobs:
  publish-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply validated R18.4 source patch
        run: python3 tools/r184_apply_native_tap_debug.py

      - name: Check embedded JavaScript
        run: python3 tools/check_embedded_js_syntax.py

      - name: Commit only intended source files and remove one-shot helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/GeminiTranslateApp.kt
          git add app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt
          git add app/src/main/java/com/oai/geminilivetranslate/network/AiStudioNativeTapDebugSupport.kt
          git rm -f tools/r184_apply_native_tap_debug.py
          git rm -f .github/workflows/r184-native-tap-debug-build-once.yml
          git diff --cached --check
          git commit -m "R18.4: native Start tap and visible AI Studio debug WebView"
          git push origin HEAD:experiment/aistudio-r183-network-vi
