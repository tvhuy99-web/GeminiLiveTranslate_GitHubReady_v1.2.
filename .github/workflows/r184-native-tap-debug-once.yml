name: R18.4 Native Start Tap Debug Patch Once

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi

permissions:
  contents: write

jobs:
  patch-once:
    if: github.event.head_commit.message == 'CI: apply R18.4 native Start tap debug patch once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Apply native Start tap and visible WebView debug patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app/src/main/java/com/oai/geminilivetranslate/GeminiTranslateApp.kt')
          app = app_path.read_text()
          old_imports = '''import android.app.Application
          import android.content.Context
          import android.os.Build
          '''
          new_imports = '''import android.app.Activity
          import android.app.Application
          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          '''
          if old_imports not in app:
              raise SystemExit('GeminiTranslateApp imports anchor not found')
          app = app.replace(old_imports, new_imports, 1)
          if 'import java.lang.ref.WeakReference\n' not in app:
              app = app.replace('import java.util.Locale\n', 'import java.lang.ref.WeakReference\nimport java.util.Locale\n', 1)

          old_oncreate = '''        appContext = applicationContext

                  val logger = SessionLogger(this, AppPreferences(this))
          '''
          new_oncreate = '''        appContext = applicationContext
                  registerActivityLifecycleCallbacks(object : Application.ActivityLifecycleCallbacks {
                      override fun onActivityCreated(activity: Activity, savedInstanceState: Bundle?) = Unit
                      override fun onActivityStarted(activity: Activity) = Unit
                      override fun onActivityResumed(activity: Activity) {
                          foregroundActivity = WeakReference(activity)
                      }
                      override fun onActivityPaused(activity: Activity) {
                          if (foregroundActivity?.get() === activity) foregroundActivity = null
                      }
                      override fun onActivityStopped(activity: Activity) = Unit
                      override fun onActivitySaveInstanceState(activity: Activity, outState: Bundle) = Unit
                      override fun onActivityDestroyed(activity: Activity) {
                          if (foregroundActivity?.get() === activity) foregroundActivity = null
                      }
                  })

                  val logger = SessionLogger(this, AppPreferences(this))
          '''
          if old_oncreate not in app:
              raise SystemExit('GeminiTranslateApp onCreate anchor not found')
          app = app.replace(old_oncreate, new_oncreate, 1)

          old_companion = '''    companion object {
                  @Volatile private var appContext: Context? = null

                  fun requireAppContext(): Context =
                      requireNotNull(appContext) { "GeminiTranslateApp chưa được khởi tạo" }
              }
          '''
          new_companion = '''    companion object {
                  @Volatile private var appContext: Context? = null
                  @Volatile private var foregroundActivity: WeakReference<Activity>? = null

                  fun requireAppContext(): Context =
                      requireNotNull(appContext) { "GeminiTranslateApp chưa được khởi tạo" }

                  fun currentActivity(): Activity? = foregroundActivity?.get()
              }
          '''
          if old_companion not in app:
              raise SystemExit('GeminiTranslateApp companion anchor not found')
          app = app.replace(old_companion, new_companion, 1)
          app_path.write_text(app)

          support_path = Path('app/src/main/java/com/oai/geminilivetranslate/network/AiStudioNativeTapDebugSupport.kt')
          support_path.write_text(r'''package com.oai.geminilivetranslate.network

          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Gravity
          import android.view.InputDevice
          import android.view.MotionEvent
          import android.view.ViewGroup
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import com.oai.geminilivetranslate.GeminiTranslateApp
          import com.oai.geminilivetranslate.core.SessionLogger
          import org.json.JSONObject
          import java.lang.ref.WeakReference
          import java.util.WeakHashMap
          import kotlin.math.roundToInt

          /** Temporary device-debug support for AI Studio Live Start activation. */
          internal object AiStudioNativeTapDocumentStart {
              const val VERSION = "2026-09-04-r18.4-native-start-tap-debug"

              val DOCUMENT_START: String = """
          (function(){
            'use strict';
            if(window.__AIS_NATIVE_START_TAP__&&window.__AIS_NATIVE_START_TAP__.version)return;
            const VERSION='2026-09-04-r18.4-native-start-tap-debug';
            const bridge=window.AIStudioNativeTapBridge;
            if(!bridge)return;

            function safeText(v,n){return String(v||'').replace(/\s+/g,' ').trim().slice(0,n||160);}
            function attr(el,name){try{return el&&el.getAttribute?safeText(el.getAttribute(name)||'',120):'';}catch(_){return '';}}
            function role(el){return attr(el,'role').toLowerCase();}
            function tag(el){try{return String(el&&el.tagName||'').toUpperCase();}catch(_){return '';}}
            function label(el){
              try{return safeText([attr(el,'aria-label'),attr(el,'data-testid'),attr(el,'name'),attr(el,'id'),safeText(el&&el.title||'',80),safeText(el&&el.value||'',100),safeText(el&&el.textContent||'',180)].filter(Boolean).join(' '),280).toLowerCase();}catch(_){return '';}
            }
            function startLike(el){
              const l=label(el),r=role(el),t=tag(el);if(!l||l.indexOf('stop')>=0)return false;
              if(!(t==='BUTTON'||t==='A'||r==='button'||r==='menuitem'||r==='tab'||r==='link'))return false;
              return /\b(start|begin|connect|talk|speak|join)\b/.test(l)||l.indexOf('go live')>=0||l.indexOf('start session')>=0||l.indexOf('start live')>=0;
            }
            function clickableAncestor(node){
              let el=node&&node.nodeType===1?node:null;
              for(let i=0;i<7&&el;i++,el=el.parentElement){if(startLike(el))return el;}
              return null;
            }
            function reportGesture(kind,ev){
              try{
                const el=clickableAncestor(ev&&ev.target);if(!el)return;
                bridge.reportStartGesture(JSON.stringify({kind:kind,trusted:!!ev.isTrusted,tag:tag(el)||'none',role:role(el)||'none',label:safeText(label(el),100)}));
              }catch(_){}
            }
            ['pointerdown','touchstart','mousedown','pointerup','touchend','mouseup','click'].forEach(function(kind){
              try{document.addEventListener(kind,function(ev){reportGesture(kind,ev);},true);}catch(_){}
            });

            const proto=window.HTMLElement&&window.HTMLElement.prototype;
            const nativeClick=proto&&proto.click;
            if(proto&&typeof nativeClick==='function'&&!nativeClick.__aisNativeStartTapWrapped){
              const wrapped=function(){
                try{
                  if(startLike(this)){
                    let r=this.getBoundingClientRect();
                    if(r&&r.width>1&&r.height>1){
                      const vw=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
                      const vh=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
                      let cx=r.left+r.width/2,cy=r.top+r.height/2;
                      if(cx<0||cy<0||cx>vw||cy>vh){
                        try{this.scrollIntoView({block:'center',inline:'center'});}catch(_){}
                        r=this.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;
                      }
                      if(cx>=0&&cy>=0&&cx<=vw&&cy<=vh){
                        bridge.requestNativeTap(JSON.stringify({xRatio:cx/vw,yRatio:cy/vh,tag:tag(this)||'none',role:role(this)||'none',label:safeText(label(this),100)}));
                        return;
                      }
                    }
                  }
                }catch(_){}
                return nativeClick.apply(this,arguments);
              };
              wrapped.__aisNativeStartTapWrapped=true;
              proto.click=wrapped;
            }
            window.__AIS_NATIVE_START_TAP__={version:VERSION};
          })();
              """.trimIndent()
          }

          internal class AiStudioNativeTapController(
              private val webView: WebView,
              private val logger: SessionLogger,
          ) {
              private val main = Handler(Looper.getMainLooper())
              @Volatile private var lastTapAt = 0L

              @JavascriptInterface
              fun requestNativeTap(json: String?) {
                  val parsed = runCatching { JSONObject(json.orEmpty()) }.getOrNull()
                  val xRatio = parsed?.optDouble("xRatio", Double.NaN) ?: Double.NaN
                  val yRatio = parsed?.optDouble("yRatio", Double.NaN) ?: Double.NaN
                  val tag = parsed?.optString("tag").orEmpty().take(32)
                  val role = parsed?.optString("role").orEmpty().take(48)
                  if (!xRatio.isFinite() || !yRatio.isFinite() || xRatio !in 0.0..1.0 || yRatio !in 0.0..1.0) {
                      logger.log(1, "AiStudioNativeTap", "START_TAP_REJECT invalidCoordinates=true")
                      return
                  }
                  main.post {
                      val now = SystemClock.uptimeMillis()
                      if (now - lastTapAt < 1200L) {
                          logger.log(3, "AiStudioNativeTap", "START_TAP_SKIPPED debounce=true")
                          return@post
                      }
                      val width = webView.width
                      val height = webView.height
                      if (width < 4 || height < 4 || !webView.isShown) {
                          logger.log(1, "AiStudioNativeTap", "START_TAP_REJECT laidOut=${width >= 4 && height >= 4} shown=${webView.isShown} width=$width height=$height")
                          return@post
                      }
                      lastTapAt = now
                      val x = (xRatio * width).toFloat().coerceIn(1f, (width - 2).toFloat())
                      val y = (yRatio * height).toFloat().coerceIn(1f, (height - 2).toFloat())
                      val downTime = SystemClock.uptimeMillis()
                      val down = MotionEvent.obtain(downTime, downTime, MotionEvent.ACTION_DOWN, x, y, 0).apply {
                          source = InputDevice.SOURCE_TOUCHSCREEN
                      }
                      val downHandled = runCatching { webView.dispatchTouchEvent(down) }.getOrDefault(false)
                      down.recycle()
                      logger.log(2, "AiStudioNativeTap", "START_TAP_DOWN x=${x.roundToInt()} y=${y.roundToInt()} width=$width height=$height handled=$downHandled tag=$tag role=$role")
                      main.postDelayed({
                          if (!webView.isAttachedToWindow) {
                              logger.log(1, "AiStudioNativeTap", "START_TAP_UP skipped=detached")
                              return@postDelayed
                          }
                          val upTime = SystemClock.uptimeMillis()
                          val up = MotionEvent.obtain(downTime, upTime, MotionEvent.ACTION_UP, x, y, 0).apply {
                              source = InputDevice.SOURCE_TOUCHSCREEN
                          }
                          val upHandled = runCatching { webView.dispatchTouchEvent(up) }.getOrDefault(false)
                          up.recycle()
                          logger.log(2, "AiStudioNativeTap", "START_TAP_UP x=${x.roundToInt()} y=${y.roundToInt()} handled=$upHandled durationMs=${upTime - downTime}")
                      }, 72L)
                  }
              }

              @JavascriptInterface
              fun reportStartGesture(json: String?) {
                  val parsed = runCatching { JSONObject(json.orEmpty()) }.getOrNull() ?: return
                  val kind = parsed.optString("kind").take(24)
                  val trusted = parsed.optBoolean("trusted", false)
                  val tag = parsed.optString("tag").take(32)
                  val role = parsed.optString("role").take(48)
                  logger.log(2, "AiStudioNativeTap", "START_GESTURE kind=$kind trusted=$trusted tag=$tag role=$role")
              }
          }

          internal object AiStudioDebugWebViewHost {
              const val VERSION = "2026-09-04-r18.4-visible-live-webview-debug"
              private val main = Handler(Looper.getMainLooper())
              private val panels = WeakHashMap<WebView, WeakReference<ViewGroup>>()

              fun attach(webView: WebView, logger: SessionLogger, retry: Int = 0) {
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      main.post { attach(webView, logger, retry) }
                      return
                  }
                  val activity = GeminiTranslateApp.currentActivity()
                  if (activity == null) {
                      if (retry < 12) main.postDelayed({ attach(webView, logger, retry + 1) }, 150L)
                      else logger.log(1, "AiStudioDebugWeb", "VISIBLE_WEBVIEW_ATTACH_FAILED reason=no-foreground-activity")
                      return
                  }
                  val content = activity.findViewById<ViewGroup>(android.R.id.content)
                  if (content == null) {
                      logger.log(1, "AiStudioDebugWeb", "VISIBLE_WEBVIEW_ATTACH_FAILED reason=no-content-root")
                      return
                  }
                  (webView.parent as? ViewGroup)?.removeView(webView)
                  val panel = LinearLayout(activity).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.WHITE)
                      elevation = 16f * resources.displayMetrics.density
                  }
                  val label = TextView(activity).apply {
                      text = "AI Studio kiểm tra tạm thời - đây là chính phiên Live ứng dụng đang dùng"
                      setTextColor(Color.BLACK)
                      setBackgroundColor(Color.WHITE)
                      setPadding(dp(activity, 8), dp(activity, 6), dp(activity, 8), dp(activity, 6))
                      textSize = 14f
                  }
                  panel.addView(label, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
                  panel.addView(webView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  val screenHeight = activity.resources.displayMetrics.heightPixels
                  val height = (screenHeight * 0.48f).roundToInt().coerceAtLeast(dp(activity, 300))
                  content.addView(panel, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, height, Gravity.BOTTOM))
                  panels[webView] = WeakReference(panel)
                  logger.log(2, "AiStudioDebugWeb", "VISIBLE_WEBVIEW_ATTACHED visible=true height=$height screenHeight=$screenHeight accessibilityPreserved=true")
              }

              fun detach(webView: WebView, logger: SessionLogger) {
                  if (Looper.myLooper() != Looper.getMainLooper()) {
                      main.post { detach(webView, logger) }
                      return
                  }
                  val panel = panels.remove(webView)?.get()
                  (webView.parent as? ViewGroup)?.removeView(webView)
                  (panel?.parent as? ViewGroup)?.removeView(panel)
                  logger.log(3, "AiStudioDebugWeb", "VISIBLE_WEBVIEW_DETACHED")
              }

              private fun dp(activity: android.app.Activity, value: Int): Int =
                  (value * activity.resources.displayMetrics.density).roundToInt()
          }
          '''.replace('\n          ', '\n').lstrip())

          realtime_path = Path('app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt')
          realtime = realtime_path.read_text()

          old_close = '''            if (current != null) {
                          runCatching { current.stopLoading() }
                          runCatching { current.onPause() }
                          runCatching { current.removeJavascriptInterface(DIAGNOSTIC_BRIDGE_NAME) }
                          runCatching { current.loadUrl("about:blank") }
          '''
          new_close = '''            if (current != null) {
                          AiStudioDebugWebViewHost.detach(current, logger)
                          runCatching { current.stopLoading() }
                          runCatching { current.onPause() }
                          runCatching { current.removeJavascriptInterface(DIAGNOSTIC_BRIDGE_NAME) }
                          runCatching { current.removeJavascriptInterface(NATIVE_TAP_BRIDGE_NAME) }
                          runCatching { current.loadUrl("about:blank") }
          '''
          if old_close not in realtime:
              raise SystemExit('AiStudioWebRealtimeClient close anchor not found')
          realtime = realtime.replace(old_close, new_close, 1)

          old_create = '''        configureWebView(created)
                  created.addJavascriptInterface(DiagnosticBridge(), DIAGNOSTIC_BRIDGE_NAME)

                  WebViewCompat.addDocumentStartJavaScript(
                      created,
                      AiStudioWebSessionR14DirectLiveEngine.DOCUMENT_START,
          '''
          new_create = '''        configureWebView(created)
                  created.addJavascriptInterface(DiagnosticBridge(), DIAGNOSTIC_BRIDGE_NAME)
                  created.addJavascriptInterface(AiStudioNativeTapController(created, logger), NATIVE_TAP_BRIDGE_NAME)
                  AiStudioDebugWebViewHost.attach(created, logger)

                  WebViewCompat.addDocumentStartJavaScript(
                      created,
                      AiStudioNativeTapDocumentStart.DOCUMENT_START,
                      setOf(AI_STUDIO_ORIGIN),
                  )
                  WebViewCompat.addDocumentStartJavaScript(
                      created,
                      AiStudioWebSessionR14DirectLiveEngine.DOCUMENT_START,
          '''
          if old_create not in realtime:
              raise SystemExit('AiStudioWebRealtimeClient creation anchor not found')
          realtime = realtime.replace(old_create, new_create, 1)

          old_const = '''        private const val DIAGNOSTIC_BRIDGE_NAME = "AIStudioWebSessionLab"
                  private const val AI_STUDIO_ORIGIN = "https://aistudio.google.com"
          '''
          new_const = '''        private const val DIAGNOSTIC_BRIDGE_NAME = "AIStudioWebSessionLab"
                  private const val NATIVE_TAP_BRIDGE_NAME = "AIStudioNativeTapBridge"
                  private const val AI_STUDIO_ORIGIN = "https://aistudio.google.com"
          '''
          if old_const not in realtime:
              raise SystemExit('AiStudioWebRealtimeClient constants anchor not found')
          realtime = realtime.replace(old_const, new_const, 1)
          realtime = realtime.replace('const val VERSION = "2026-09-04-production-hidden-ai-studio-live-r2-isolated-bootstrap"', 'const val VERSION = "2026-09-04-production-ai-studio-live-r3-visible-native-tap-debug"', 1)
          realtime = realtime.replace('CONNECT hidden=true isolatedLiveHost=true', 'CONNECT hidden=false debugVisible=true isolatedLiveHost=true', 1)
          realtime = realtime.replace('RUNTIME_STARTED hidden=true isolatedLiveHost=true', 'RUNTIME_STARTED hidden=false debugVisible=true isolatedLiveHost=true', 1)
          realtime = realtime.replace('CLOSE hidden=true graceful=', 'CLOSE hidden=false debugVisible=true graceful=', 1)
          realtime_path.write_text(realtime)
          PY

      - name: Check embedded JavaScript syntax
        run: python3 tools/check_embedded_js_syntax.py

      - name: Remove one-shot workflow and commit source patch
        shell: bash
        run: |
          rm -f .github/workflows/r184-native-tap-debug-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/GeminiTranslateApp.kt \
                  app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt \
                  app/src/main/java/com/oai/geminilivetranslate/network/AiStudioNativeTapDebugSupport.kt \
                  .github/workflows/r184-native-tap-debug-once.yml
          git diff --cached --check
          git commit -m "R18.4: native Start tap and visible AI Studio debug WebView"
          git push origin HEAD:experiment/aistudio-r183-network-vi
