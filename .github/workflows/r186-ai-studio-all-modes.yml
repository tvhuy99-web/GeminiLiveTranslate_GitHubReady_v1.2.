          # 3) R18 target language must never silently fall back to Vietnamese.
          p = Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR18LanguageGuard.kt')
          s = p.read_text()
          s = replace_once(s,
