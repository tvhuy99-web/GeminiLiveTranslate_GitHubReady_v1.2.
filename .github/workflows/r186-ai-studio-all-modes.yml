          new = '''        val r17LanguageVerified = bootstrap.optBoolean("targetLanguageVerified", false)
        val r18LanguageVerified = runCatching {
            JSONObject(lastLanguageGuardState).optBoolean("targetLanguageVerified", false)
        }.getOrDefault(false)
