          p = Path('app/src/main/java/com/oai/geminilivetranslate/network/AiStudioNativeTapDebugSupport.kt')
          s = p.read_text()
          s = s.replace('private val logger: SessionLogger,', 'private val logger: SessionLogger?,')
          s = s.replace('fun attach(webView: WebView, logger: SessionLogger, retry: Int = 0)', 'fun attach(webView: WebView, logger: SessionLogger?, retry: Int = 0)')
          s = s.replace('fun detach(webView: WebView, logger: SessionLogger)', 'fun detach(webView: WebView, logger: SessionLogger?)')
          s = s.replace('logger.log(', 'logger?.log(')
          s = s.replace('AI Studio kiểm tra tạm thời - đây là chính phiên Live ứng dụng đang dùng', 'AI Studio kiểm tra tạm thời - đây là chính phiên AI Studio ứng dụng đang dùng')
          p.write_text(s)

          # 2) Re-enable the proven R11 model/file/attachment machinery in production web-session executor.
          p = Path('app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt')
          s = p.read_text()
          s = replace_once(s,
              'import android.graphics.Bitmap\nimport android.net.http.SslError',
              'import android.graphics.Bitmap\nimport android.net.Uri\nimport android.net.http.SslError',
              'executor Uri import')
          s = replace_once(s,
              'import android.webkit.WebSettings\nimport android.webkit.WebView',
              'import android.webkit.ValueCallback\nimport android.webkit.WebSettings\nimport android.webkit.WebView',
              'executor ValueCallback import')
          s = replace_once(s,
              'import com.oai.geminilivetranslate.ui.AiStudioWebSessionLabScripts\nimport com.oai.geminilivetranslate.ui.AiStudioWebSessionR11SubmitTargetFix',
              'import com.oai.geminilivetranslate.ui.AiStudioWebSessionLabScripts\nimport com.oai.geminilivetranslate.ui.AiStudioWebSessionR11RequestFix\nimport com.oai.geminilivetranslate.ui.AiStudioWebSessionR11SubmitTargetFix\nimport com.oai.geminilivetranslate.ui.AiStudioWebSessionR11Support',
              'executor R11 imports')
          s = replace_once(s,
              'import com.oai.geminilivetranslate.ui.AiStudioWebSessionResponseCore\nimport org.json.JSONObject',
              'import com.oai.geminilivetranslate.ui.AiStudioWebSessionResponseCore\nimport com.oai.geminilivetranslate.network.AiStudioDebugWebViewHost\nimport com.oai.geminilivetranslate.network.AiStudioNativeTapController\nimport org.json.JSONObject',
              'executor native support imports')

          s = replace_once(s,
              '    private var directRecoverySeq = -1\n\n    private data class Pending(',
              '''    private var directRecoverySeq = -1
    private var attachmentSeq = 0
    private var activeAttachment: PendingAttachment? = null
    private val nativeTapController = AiStudioNativeTapController(webView, null)

    private data class PendingAttachment(
