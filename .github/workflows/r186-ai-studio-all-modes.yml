          # add timeout constant alongside existing constants
          s = replace_once(s,
              '        private const val DEFAULT_TIMEOUT_MS = 120_000L',
              '        private const val DEFAULT_TIMEOUT_MS = 120_000L\n        private const val ATTACHMENT_TIMEOUT_MS = 90_000L',
