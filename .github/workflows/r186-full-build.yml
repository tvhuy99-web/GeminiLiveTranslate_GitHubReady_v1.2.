name: R18.6 Full AI Studio Build JUnit4

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r186-full-build.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply real R18.6 full source patch
        run: python3 tools/run_r186_full_patch.py

      - name: Verify R18.6 routing source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '!aiStudioMode && apiKey.isNullOrBlank()' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'val useLiveFileTranscribe = aiStudioMode' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'mode == SourceMode.FILE && !transcribeFileViaLive' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'AiStudioVideoDescriptionClient(' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          test -s app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          grep -q 'TARGET_LANGUAGE_MISSING_OR_INVALID' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR18LanguageGuard.kt
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          python3 tools/check_embedded_js_syntax.py

      - name: Test lint and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify signed APK is actually new
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95"
          NEW_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "R18.6 REAL APK SHA256=$NEW_SHA"
          test "$NEW_SHA" != "a3b78e9c3370b5986e7d93a5728b933b722e0f2bb8964d45c574101d780a6d71"
          cp "$APK" GeminiLiveTranslate-R18.6-real-ai-studio-all-modes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.6-real-ai-studio-all-modes
          path: GeminiLiveTranslate-R18.6-real-ai-studio-all-modes.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated R18.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r186-full-build.yml
          rm -f .github/workflows/r186-ai-studio-all-modes.yml
          rm -f tools/run_r186_full_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git add -u .github/workflows/r186-full-build.yml .github/workflows/r186-ai-studio-all-modes.yml tools/run_r186_full_patch.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No validated R18.6 source changes"; exit 1; }
          git commit -m "fix: route AI Studio transcribe and video without API key"
          git push origin HEAD:experiment/aistudio-r183-network-vi
