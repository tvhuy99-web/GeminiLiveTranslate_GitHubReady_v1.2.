name: R18.8 video upload and live start reliability

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r188-video-upload-live-start.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply R18.8 patch
        run: python3 tools/r188_patch.py
      - name: Verify R18.8 source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'r11.6-upload-ready-gate' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -q 'submissionReadinessIfAttachment' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetFix.kt
          grep -q 'R18_ATTACHMENT_WAIT_UPLOAD' app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          grep -q 'R18_ATTACHMENT_UPLOAD_READY' app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt
          grep -q 'r17.8-progress-aware-start-ack' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt
          grep -q 'startProgressEvidence' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt
          grep -q 'START_SESSION_RECOVERY' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt
          grep -q 'r6-progress-aware-start-debug' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt
          python3 tools/check_no_secrets.py
          python3 tools/verify_project.py
          python3 tools/verify_github_ready.py
          python3 tools/check_embedded_js_syntax.py
      - name: Test lint and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug
      - name: Verify signed R18.8 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95"
          NEW_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "R18.8 APK SHA256=$NEW_SHA"
          test "$NEW_SHA" != "eb5e38c95b19eee99a865ff93087cf744f83accebcfb7687d4adaacfbb4ab219"
          cp "$APK" GeminiLiveTranslate-R18.8-video-upload-live-start-reliability.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.8-video-upload-live-start-reliability
          path: GeminiLiveTranslate-R18.8-video-upload-live-start-reliability.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated R18.8 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r188-video-upload-live-start.yml
          rm -f tools/r188_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/test/java
          git add -u .github/workflows/r188-video-upload-live-start.yml tools/r188_patch.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No validated R18.8 source changes"; exit 1; }
          git commit -m "fix: wait for video upload and recover live start"
          git push origin HEAD:experiment/aistudio-r183-network-vi
