name: R18.9 Manual Video + File Transcribe

on:
  push:
    branches:
      - experiment/aistudio-r183-network-vi
    paths:
      - .github/workflows/r189-manual-video-file-transcribe.yml

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: experiment/aistudio-r183-network-vi
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply R18.9 source patch
        run: |
          set -euo pipefail
          python3 tools/apply_r189_manual_video_file_transcribe.py

      - name: Verify R18.9 routing and manual-video invariants
        run: |
          set -euo pipefail
          grep -q 'awaitManualAttachmentGenerate' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          grep -q 'autoSubmit=false' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt
          grep -q 'FILE_TRANSCRIBE backend=aistudio-file' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'val useLiveFileTranscribe = false' app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt
          grep -q 'generateAttachmentNativeOnly' app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt
          grep -q 'uploadObserved=uploadStarted>0' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt
          grep -q 'limit=progress.progress?8000:10000' app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt
          python3 tools/check_embedded_js_syntax.py

      - name: Test lint and build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean testDebugUnitTest assembleDebug lintDebug

      - name: Verify APK
        id: apk
        env:
          EXPECTED_CERT_SHA256: 85e27156c4557de4f35b6ebe771dd426f108182894219ff3b6dbed607a230c95
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk.py "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.oai.geminilivetranslate.debug' versionCode='10202' versionName='1.2.2-debug'" badging.txt
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' apksigner.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          test "$SHA" != "aa09a305ba115818fa5feccf5e48f46a18270443c1d2df572f0568c7d48e1d71"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "R18.9 APK SHA-256: $SHA size=$SIZE"

      - name: Upload R18.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-R18.9-manual-video-file-transcribe
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated R18.9 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebSessionExecutor.kt \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioFileTranscribeClient.kt \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioVideoDescriptionClient.kt \
            app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt \
            app/src/main/java/com/oai/geminilivetranslate/service/TranslationService.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11RequestFix.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR11SubmitTargetFix.kt \
            app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt
          git diff --cached --check
          git commit -m 'R18.9: manual video submit, file transcribe model, fast live recovery'
          git push origin HEAD:experiment/aistudio-r183-network-vi
