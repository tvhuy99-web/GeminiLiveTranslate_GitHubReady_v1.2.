name: One-time Live service backend log fix

"on":
  push:
    branches:
      - fix/live-screen-description-ai-studio
    paths:
      - .github/workflows/zz-fix-live-service-backend-log.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-screen-description-ai-studio
      - name: Fix backend log self reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/oai/geminilivetranslate/service/LiveVideoDescriptionService.kt')
          s = p.read_text()
          needle = '        val outputLanguage = LanguageCatalog.displayName(settings.targetLanguage)\n        val client = ScreenDescriptionLiveClient('
          replacement = '        val outputLanguage = LanguageCatalog.displayName(settings.targetLanguage)\n        val selectedBackend = if (connectionMode == AiConnectionModeStore.MODE_AI_STUDIO) "ai_studio" else "api_key"\n        val client = ScreenDescriptionLiveClient('
          if s.count(needle) != 1:
              raise SystemExit('output language insertion point mismatch')
          s = s.replace(needle, replacement, 1)
          if s.count('backend=${client.backendName}') != 2:
              raise SystemExit('backend log reference count mismatch')
          s = s.replace('backend=${client.backendName}', 'backend=$selectedBackend')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/service/LiveVideoDescriptionService.kt
          git commit -m "Fix Live backend log initialization"
          git push origin HEAD:fix/live-screen-description-ai-studio
