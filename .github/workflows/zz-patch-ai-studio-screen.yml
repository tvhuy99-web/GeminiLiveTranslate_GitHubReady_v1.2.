          s = rep(s, old, new, 'main start live route')
          write(p, s)

          # 3) Android -> AI Studio WebView input client: add JPEG injection entry point.
          p = 'app/src/main/java/com/oai/geminilivetranslate/core/AiStudioWebLiveClient.kt'
