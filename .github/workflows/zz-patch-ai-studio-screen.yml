    if(model&&model===String(state.targetModel||'').toLowerCase().replace(/^models\//,'')){
      seen++;
      const gk=Object.prototype.hasOwnProperty.call(node,'generation_config')?'generation_config':'generationConfig';let gc=node[gk];
