name: One-time AI Studio screen integration patch

"on":
  push:
    branches:
      - fix/live-screen-description-ai-studio
    paths:
      - .github/workflows/zz-patch-ai-studio-screen.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-screen-description-ai-studio
          fetch-depth: 0
      - name: Apply source patch
        run: |
          sed -i 's/re.subn(pattern, new, text, count=1, flags=flags)/re.subn(pattern, lambda _m: new, text, count=1, flags=flags)/' .github/scripts/patch_ai_studio_screen.py
          sed -i 's/STREAM_END_CARRIER_GRACE_MS = 1_500L/STREAM_END_CARRIER_GRACE_MS = 900L/' .github/scripts/patch_ai_studio_screen.py
          python3 .github/scripts/patch_ai_studio_screen.py
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Route Live screen description through AI Studio"
          git push origin HEAD:fix/live-screen-description-ai-studio
