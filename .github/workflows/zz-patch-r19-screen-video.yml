name: One-time R19 screen video patch

"on":
  push:
    branches:
      - fix/live-screen-description-ai-studio
    paths:
      - .github/workflows/zz-patch-r19-screen-video.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-screen-description-ai-studio
          fetch-depth: 0
      - name: Apply R19 source patch
        run: |
          python3 .github/scripts/patch_r19_screen_video.py
          git diff --check
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Use native AI Studio video track for screen Live"
          git push origin HEAD:fix/live-screen-description-ai-studio
