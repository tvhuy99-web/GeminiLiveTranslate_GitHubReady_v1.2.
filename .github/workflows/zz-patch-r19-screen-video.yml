name: One-time R19 screen video patch

"on":
  push:
    branches:
      - fix/live-screen-description-ai-studio
    paths:
      - .github/workflows/zz-patch-r19-screen-video.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-screen-description-ai-studio
          fetch-depth: 0
      - name: Patch AI Studio Live to use canvas video track
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rep(s, old, new, label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 got {n}')
              return s.replace(old,new,1)

          p=Path('app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt')
          s=p.read_text()
          s=rep(s,'import android.os.SystemClock\n','import android.os.SystemClock\nimport android.util.Base64\n','import base64')
          s=rep(s,'import com.oai.geminilivetranslate.ui.AiStudioWebSessionR18LanguageGuard\n','import com.oai.geminilivetranslate.ui.AiStudioWebSessionR18LanguageGuard\nimport com.oai.geminilivetranslate.ui.AiStudioWebSessionR19ScreenVideoBridge\n','import r19')
          s=rep(s,'    @Volatile private var lastLanguageGuardState = ""\n','    @Volatile private var lastLanguageGuardState = ""\n    @Volatile private var lastScreenVideoState = ""\n    @Volatile private var lastScreenFramesDrawn = 0L\n','screen state')

          pattern=r'''    fun sendVideoFrame\(jpeg: ByteArray\): GeminiLiveClient\.SendResult \{.*?\n    \}\n\n    fun backpressureStats\(\): GeminiLiveClient\.BackpressureStats \{'''
          replacement='''    fun sendVideoFrame(jpeg: ByteArray): GeminiLiveClient.SendResult {
        if (!screenDescription) return GeminiLiveClient.SendResult.FAILED
        if (jpeg.isEmpty()) return GeminiLiveClient.SendResult.SENT
        if (closed.get()) return GeminiLiveClient.SendResult.CLOSED
        if (!setupDelivered.get()) return GeminiLiveClient.SendResult.NOT_READY
        val current = webView ?: return GeminiLiveClient.SendResult.NOT_READY
        val now = SystemClock.elapsedRealtime()
        lastInputAt = now
        lastProgressAt = now
        val encoded = Base64.encodeToString(jpeg, Base64.NO_WRAP)
        if (encoded.length > SCREEN_DESCRIPTION_MAX_BASE64_CHARS) {
            backpressureEvents.incrementAndGet()
            logger.log(1, "AiStudioScreenVideo", "FRAME_REJECT reason=too-large jpegBytes=${jpeg.size} base64Chars=${encoded.length}")
            return GeminiLiveClient.SendResult.BACKPRESSURED
        }
        val quoted = JSONObject.quote(encoded)
        current.post {
            if (closed.get()) return@post
            current.evaluateJavascript(
                "JSON.stringify(window.__AIS_R19_SCREEN_VIDEO__?window.__AIS_R19_SCREEN_VIDEO__.pushJpeg($quoted):({ok:false,error:'r19-not-installed'}))",
            ) { raw ->
                val decoded = decodeEvalValue(raw)
                logger.log(3, "AiStudioScreenVideo", "FRAME_PUSH jpegBytes=${jpeg.size} ${safe(decoded, 900)}")
            }
        }
        return GeminiLiveClient.SendResult.SENT
    }

    fun backpressureStats(): GeminiLiveClient.BackpressureStats {'''
          s,n=re.subn(pattern,lambda m:replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'sendVideoFrame replace {n}')

          marker='''        WebViewCompat.addDocumentStartJavaScript(
            created,
            AiStudioWebSessionR17ProductionBootstrap.DOCUMENT_START,
            setOf(AI_STUDIO_ORIGIN),
        )
'''
          addition=marker+'''        WebViewCompat.addDocumentStartJavaScript(
            created,
            AiStudioWebSessionR19ScreenVideoBridge.DOCUMENT_START,
            setOf(AI_STUDIO_ORIGIN),
        )
'''
          s=rep(s,marker,addition,'install r19')

          old='''        val languageCall = if (transcribe || screenDescription) {
            "null"
        } else {
            "(window.__AIS_R183_LANGUAGE__?window.__AIS_R183_LANGUAGE__.configure($language):({ok:false,error:'r183-language-not-installed'}))"
        }
        current.evaluateJavascript(
            "JSON.stringify({bootstrap:(window.__AIS_R17_PRODUCTION__?window.__AIS_R17_PRODUCTION__.configure($language,$transcribeJs,false,$requestedModel,$screenJs,$requestedPrompt):({ok:false,error:'r17-not-installed'})),language:$languageCall})",
        ) { raw ->
            val decoded = decodeEvalValue(raw)
            val root = runCatching { JSONObject(decoded) }.getOrNull()
            val bootstrap = root?.optJSONObject("bootstrap")
            val languageGuard = root?.optJSONObject("language")
            val bootstrapOk = bootstrap?.optBoolean("ok") == true
            val languageOk = transcribe || screenDescription || languageGuard?.optBoolean("ok") == true
            if (bootstrapOk && languageOk) {
                configured = true
                languageGuardConfigured = !transcribe && !screenDescription && languageOk
                lastBootstrapState = bootstrap.toString()
                if (!transcribe && languageGuard != null) lastLanguageGuardState = languageGuard.toString()
'''
          new='''        val languageCall = if (transcribe || screenDescription) {
            "null"
        } else {
            "(window.__AIS_R183_LANGUAGE__?window.__AIS_R183_LANGUAGE__.configure($language):({ok:false,error:'r183-language-not-installed'}))"
        }
        val screenCall = if (screenDescription) {
            "(window.__AIS_R19_SCREEN_VIDEO__?window.__AIS_R19_SCREEN_VIDEO__.configure(true):({ok:false,error:'r19-not-installed'}))"
        } else {
            "null"
        }
        current.evaluateJavascript(
            "JSON.stringify({bootstrap:(window.__AIS_R17_PRODUCTION__?window.__AIS_R17_PRODUCTION__.configure($language,$transcribeJs,false,$requestedModel,$screenJs,$requestedPrompt):({ok:false,error:'r17-not-installed'})),language:$languageCall,screen:$screenCall})",
        ) { raw ->
            val decoded = decodeEvalValue(raw)
            val root = runCatching { JSONObject(decoded) }.getOrNull()
            val bootstrap = root?.optJSONObject("bootstrap")
            val languageGuard = root?.optJSONObject("language")
            val screenBridge = root?.optJSONObject("screen")
            val bootstrapOk = bootstrap?.optBoolean("ok") == true
            val languageOk = transcribe || screenDescription || languageGuard?.optBoolean("ok") == true
            val screenOk = !screenDescription || screenBridge?.optBoolean("ok") == true
            if (bootstrapOk && languageOk && screenOk) {
                configured = true
                languageGuardConfigured = !transcribe && !screenDescription && languageOk
                lastBootstrapState = bootstrap.toString()
                if (!transcribe && languageGuard != null) lastLanguageGuardState = languageGuard.toString()
                if (screenBridge != null) lastScreenVideoState = screenBridge.toString()
'''
          s=rep(s,old,new,'configure r19')
          s=s.replace('"CONFIGURED target=$targetLanguage transcribe=$transcribe model=${targetLiveModel()} languageGuardConfigured=$languageGuardConfigured"','"CONFIGURED target=$targetLanguage transcribe=$transcribe screenDescription=$screenDescription model=${targetLiveModel()} languageGuardConfigured=$languageGuardConfigured"',1)

          oldjs='''        val js = "JSON.stringify({bootstrap:window.__AIS_R17_PRODUCTION__?window.__AIS_R17_PRODUCTION__.describe():null,language:window.__AIS_R183_LANGUAGE__?window.__AIS_R183_LANGUAGE__.describe():null,direct:window.__AIS_LIVE_DIRECT_ENGINE__?window.__AIS_LIVE_DIRECT_ENGINE__.describe():null,output:window.__AIS_LIVE_OUTPUT_ENGINE__?window.__AIS_LIVE_OUTPUT_ENGINE__.describe():null})"
'''
          newjs='''        val js = "JSON.stringify({bootstrap:window.__AIS_R17_PRODUCTION__?window.__AIS_R17_PRODUCTION__.describe():null,language:window.__AIS_R183_LANGUAGE__?window.__AIS_R183_LANGUAGE__.describe():null,direct:window.__AIS_LIVE_DIRECT_ENGINE__?window.__AIS_LIVE_DIRECT_ENGINE__.describe():null,screen:window.__AIS_R19_SCREEN_VIDEO__?window.__AIS_R19_SCREEN_VIDEO__.describe():null,output:window.__AIS_LIVE_OUTPUT_ENGINE__?window.__AIS_LIVE_OUTPUT_ENGINE__.describe():null})"
'''
          s=rep(s,oldjs,newjs,'request states js')
          outmarker='''            root.optJSONObject("output")?.let { output ->
'''
          screenparse='''            root.optJSONObject("screen")?.let { screen ->
                lastScreenVideoState = screen.toString()
                val drawn = screen.optLong("framesDrawn", 0L)
                if (drawn > lastScreenFramesDrawn) {
                    lastScreenFramesDrawn = drawn
                    if (drawn == 1L || drawn % 20L == 0L) {
                        logger.log(3, "AiStudioScreenVideo", "STATE framesDrawn=$drawn gumVideoRequests=${screen.optLong("gumVideoRequests", 0L)} displayRequests=${screen.optLong("displayRequests", 0L)} cameraClicks=${screen.optInt("cameraClicks", 0)}")
                    }
                }
            }
'''+outmarker
          s=rep(s,outmarker,screenparse,'parse screen state')

          s=s.replace('direct=${safe(lastDirectState, 1800)} output=${safe(lastOutputState, 1800)}','direct=${safe(lastDirectState, 1800)} screen=${safe(lastScreenVideoState, 1800)} output=${safe(lastOutputState, 1800)}',1)
          s=s.replace('''                kind.startsWith("R183_") -> logger.log(if (kind.contains("ERROR")) 1 else 2, "AiStudioLanguage", "JS_$kind ${safe(text, 2800)}")
''','''                kind.startsWith("R183_") -> logger.log(if (kind.contains("ERROR")) 1 else 2, "AiStudioLanguage", "JS_$kind ${safe(text, 2800)}")
                kind.startsWith("R19_") -> logger.log(if (kind.contains("ERROR")) 1 else 2, "AiStudioScreenVideo", "JS_$kind ${safe(text, 2400)}")
''',1)
          s=s.replace('        private const val SCREEN_DESCRIPTION_CARRIER_PULSE_MS = 850L\n','        private const val SCREEN_DESCRIPTION_MAX_BASE64_CHARS = 3_000_000\n',1)
          p.write_text(s)

          p=Path('app/src/main/java/com/oai/geminilivetranslate/ui/AiStudioWebSessionR17ProductionBootstrap.kt')
          s=p.read_text()
          old="""      const sk=Object.prototype.hasOwnProperty.call(node,'system_instruction')?'system_instruction':'systemInstruction';
      node[sk]={parts:[{text:String(state.systemPrompt||'')}]};changed++;
"""
          new="""      const sk=Object.prototype.hasOwnProperty.call(node,'system_instruction')?'system_instruction':'systemInstruction';
      node[sk]={parts:[{text:String(state.systemPrompt||'')}]};state.instructionApplied=true;changed++;
"""
          s=rep(s,old,new,'instruction applied diagnostic')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java
          git commit -m "Use native AI Studio video track for screen Live"
          git push origin HEAD:fix/live-screen-description-ai-studio
