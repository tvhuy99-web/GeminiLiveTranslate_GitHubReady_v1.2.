name: One-time R20 screen Live readiness fix

"on":
  push:
    branches:
      - fix/live-screen-description-ai-studio
    paths:
      - .github/workflows/zz-r20-screen-ready.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-screen-description-ai-studio
          fetch-depth: 0
      - name: Apply R20 patch
        run: |
          python3 .github/scripts/fix_r20_screen_ready.py
          git diff --check
      - name: Commit source and clean one-time patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/oai/geminilivetranslate/network/AiStudioWebRealtimeClient.kt
          git rm .github/scripts/fix_r20_screen_ready.py .github/workflows/zz-r20-screen-ready.yml
          git commit -m "Allow R19 video track to mark screen Live ready"
          git push origin HEAD:fix/live-screen-description-ai-studio
